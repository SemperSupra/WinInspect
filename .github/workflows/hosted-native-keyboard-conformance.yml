name: Hosted native GUI keyboard conformance

on:
  pull_request:
    paths:
      - 'source/**'
      - 'experiments/Apply-HostedNativeHciRepair.ps1'
      - 'experiments/Normalize-HostedNativeHciLayout.ps1'
      - 'experiments/Normalize-HostedNativeKeyboardAccess.ps1'
      - 'scripts/Invoke-HostedNativeKeyboardConformance.ps1'
      - '.github/workflows/hosted-native-keyboard-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-server2025
            runner: windows-2025
            cmake_arch: x64
          - name: arm64-win11
            runner: windows-11-vs2026-arm
            cmake_arch: ARM64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout public deployment plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Apply exact HCI and keyboard candidate
        shell: pwsh
        run: |
          ./experiments/Apply-HostedNativeHciRepair.ps1
          ./experiments/Normalize-HostedNativeHciLayout.ps1
          ./experiments/Normalize-HostedNativeKeyboardAccess.ps1
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard candidate introduced whitespace errors.' }

      - name: Configure GUI
        shell: pwsh
        run: |
          cmake -S source -B build -A '${{ matrix.cmake_arch }}' -DWININSPECT_BUILD_TESTS=OFF -DWININSPECT_USE_OPENSSL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Build GUI
        shell: pwsh
        run: |
          cmake --build build --config Release --target wininspect-gui --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'WinInspect GUI build failed.' }

      - name: Exercise Tab and Shift+Tab through native message loop
        shell: pwsh
        run: |
          $gui = Get-ChildItem -Recurse build -Filter 'wininspect-gui.exe' | Select-Object -First 1
          if (-not $gui) { throw 'wininspect-gui.exe not found after build.' }
          ./scripts/Invoke-HostedNativeKeyboardConformance.ps1 -GuiPath $gui.FullName -OutputPath 'evidence/keyboard-conformance.json'

      - name: Emit keyboard summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'evidence/keyboard-conformance.json') {
            $k = Get-Content 'evidence/keyboard-conformance.json' -Raw | ConvertFrom-Json
            @"
          ### Hosted native keyboard conformance — ${{ matrix.name }}

          - status: `$($k.status)`
          - initial focus: `$($k.initial_focus.name)` / `$($k.initial_focus.control_type)`
          - after Tab: `$($k.after_tab.name)` / `$($k.after_tab.control_type)`
          - after Shift+Tab: `$($k.after_shift_tab.name)` / `$($k.after_shift_tab.control_type)`

          This directly exercises hosted-native Win32 keyboard traversal through the application message loop. It remains distinct from controlled interactive WinBot/native-desktop acceptance.
          "@ >> $env:GITHUB_STEP_SUMMARY
          } else {
            "### Hosted native keyboard conformance — ${{ matrix.name }}`n`nNo keyboard evidence was produced; inspect the job log." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload keyboard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-native-keyboard-${{ matrix.name }}
          path: evidence/keyboard-conformance.json
          if-no-files-found: warn
          retention-days: 14
