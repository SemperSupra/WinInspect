name: Public security validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: GitHub Actions security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          min-severity: low
          min-confidence: medium
          version: 1.29.0

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scorecard-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 14

  vhf-actions-preflight:
    name: Windows VHF hosted-runner preflight
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'experiment/381-vhf-actions-preflight' }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      WDS_SHA: 97429c5623590d52f001249460daf43e6749d777
    steps:
      - name: Check out exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Record runner boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $os = Get-CimInstance Win32_OperatingSystem
          [ordered]@{
            experiment = 'wininspect-381-vhf-actions-preflight'
            commit = $env:GITHUB_SHA
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            windows_caption = $os.Caption
            windows_version = $os.Version
            windows_build = $os.BuildNumber
            process_is_admin = $isAdmin
            windows_driver_samples_sha = $env:WDS_SHA
          } | ConvertTo-Json | Set-Content evidence/runner.json -Encoding utf8
          Get-Content evidence/runner.json

      - name: Acquire pinned Microsoft driver samples
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/Windows-driver-samples.git wds
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          git -C wds checkout $env:WDS_SHA -- packages.config Directory.Build.props Directory.Build.targets Build-Samples.ps1 Get-NtTargetVersions.ps1 exclusions.csv hid/vhidmini2
          if ($LASTEXITCODE -ne 0) { throw 'pinned checkout failed' }

      - name: Restore WDK NuGet packages
        shell: pwsh
        run: |
          nuget restore wds/packages.config -PackagesDirectory wds/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "WDK NuGet restore failed: $LASTEXITCODE" }
          Get-ChildItem wds/packages -Directory | Select-Object -ExpandProperty Name | Sort-Object | Set-Content evidence/wdk-packages.txt
          Get-Content evidence/wdk-packages.txt

      - name: Build Microsoft vhidmini2
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe not found' }
          & $msbuild wds/hid/vhidmini2/vhidmini2.sln /m /t:Restore,Build /p:Configuration=Release /p:Platform=x64 /bl:evidence/vhidmini2.binlog
          if ($LASTEXITCODE -ne 0) { throw "vhidmini2 build failed: $LASTEXITCODE" }
          Get-ChildItem wds/hid/vhidmini2 -Recurse -File -Include *.sys,*.inf,*.cat,*.exe |
            Select-Object FullName,Length,@{n='SHA256';e={(Get-FileHash $_.FullName -Algorithm SHA256).Hash}} |
            ConvertTo-Json -Depth 4 | Set-Content evidence/build-artifacts.json -Encoding utf8
          Get-Content evidence/build-artifacts.json

      - name: Classify hosted driver-install boundary
        shell: pwsh
        continue-on-error: true
        run: |
          $inf = Get-ChildItem wds/hid/vhidmini2 -Recurse -File -Filter vhidmini.inf | Select-Object -First 1
          $result = [ordered]@{ attempted=$false; inf=$null; exit_code=$null; classification='no-built-inf'; output=@() }
          if ($inf) {
            $result.attempted = $true
            $result.inf = $inf.FullName
            $lines = & pnputil.exe /add-driver $inf.FullName /install 2>&1
            $result.exit_code = $LASTEXITCODE
            $result.output = @($lines | ForEach-Object { "$_" })
            if ($LASTEXITCODE -eq 0) {
              $result.classification = 'hosted-runner-driver-install-accepted'
            } else {
              $joined = $result.output -join "`n"
              if ($joined -match 'signature|signed|publisher|hash') { $result.classification='hosted-runner-signing-boundary' }
              elseif ($joined -match 'reboot|restart') { $result.classification='hosted-runner-reboot-boundary' }
              elseif ($joined -match 'access|denied|privilege|administrator') { $result.classification='hosted-runner-privilege-boundary' }
              else { $result.classification='hosted-runner-install-unsupported-or-other' }
            }
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content evidence/install-capability.json -Encoding utf8
          Get-Content evidence/install-capability.json

      - name: Enumerate HID state
        if: always()
        shell: pwsh
        run: |
          Get-PnpDevice -Class HIDClass -ErrorAction SilentlyContinue |
            Select-Object Status,Class,FriendlyName,InstanceId |
            ConvertTo-Json -Depth 5 | Set-Content evidence/hid-enumeration.json -Encoding utf8

      - name: Upload VHF preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vhf-actions-preflight
          path: evidence/
          if-no-files-found: error
          retention-days: 14
