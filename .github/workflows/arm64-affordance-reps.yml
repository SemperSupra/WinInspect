name: ARM64 affordance qualification reps

on:
  pull_request:
    paths:
      - '.github/workflows/arm64-affordance-reps.yml'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-affordance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows-arm64:
    name: Native Windows 11 ARM64 runtime evidence
    runs-on: windows-11-arm
    timeout-minutes: 35
    steps:
      - name: Checkout public projected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and test native ARM64
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | Format-List
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          cmake -S source -B build-arm64 -A ARM64 -DWININSPECT_BUILD_TESTS=ON -DWININSPECT_USE_OPENSSL=OFF
          cmake --build build-arm64 --config Release --parallel 2
          ctest --test-dir build-arm64 -C Release --output-on-failure
      - name: Layered native ARM64 runtime qualification in one process lifetime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # Apply only the already causally demonstrated shared CLI send-length correction.
          $src='source/clients/cli/src/cli.cpp'; $s=Get-Content $src -Raw
          $old='uint32_t len = htonl((uint32_t)m.size());'
          if (-not $s.Contains($old)) { throw 'expected shared CLI defect not found' }
          $s=$s.Replace($old,"uint32_t payload_len = (uint32_t)m.size();`n      uint32_t len = htonl(payload_len);").Replace('if (::send(s, m.data(), (int)len, 0) <= 0)','if (::send(s, m.data(), (int)payload_len, 0) <= 0)')
          Set-Content $src $s -NoNewline
          cmake --build build-arm64 --config Release --target wininspect --parallel 2
          $p=Start-Process build-arm64/Release/wininspectd.exe -ArgumentList '--headless','--bind','127.0.0.1' -PassThru -RedirectStandardOutput arm64-wininspectd.out.log -RedirectStandardError arm64-wininspectd.err.log
          try {
            $listener=$null
            for($i=0;$i -lt 20;$i++){ Start-Sleep 1; if($p.HasExited){throw "process-session: daemon exited $($p.ExitCode)"}; $listener=Get-NetTCPConnection -State Listen -LocalAddress 127.0.0.1 -LocalPort 1985 -OwningProcess $p.Id -ErrorAction SilentlyContinue; if($listener){break} }
            if(-not $listener){throw 'transport: no loopback listener'}
            Write-Host 'QUAL_LAYER environment=pass process-session=pass transport-listener=pass bind=loopback firewall_modified=false architecture=arm64'
            @'
          import json,socket,struct
          def recvn(s,n):
              b=b''
              while len(b)<n:
                  c=s.recv(n-len(b))
                  if not c: raise RuntimeError('EOF')
                  b+=c
              return b
          with socket.create_connection(('127.0.0.1',1985),3) as s:
              n=struct.unpack('!I',recvn(s,4))[0]; print('HELLO',json.loads(recvn(s,n)))
              req=json.dumps({'id':'arm64-raw','method':'daemon.health','params':{}},separators=(',',':')).encode(); s.sendall(struct.pack('!I',len(req))+req)
              n=struct.unpack('!I',recvn(s,4))[0]; resp=json.loads(recvn(s,n)); print('RAW_HEALTH',resp); assert resp.get('ok') is True
          '@ | Set-Content arm64_raw_probe.py
            python arm64_raw_probe.py
            $target='127.0.0.1:1985'; $cli='build-arm64/Release/wininspect.exe'
            & $cli health --tcp $target; if($LASTEXITCODE){throw 'protocol-client: corrected health failed'}
            & $cli identity --tcp $target; if($LASTEXITCODE){throw 'semantic: identity failed'}
            & $cli capabilities --tcp $target; if($LASTEXITCODE){throw 'semantic: capabilities failed'}
            Write-Host 'QUAL_LAYER protocol-client=pass semantic-health-identity-capabilities=pass deepest_layer=semantic-behavior architecture=arm64'
            & $cli top --tcp $target
            Write-Host "QUAL_SENSOR top_exit=$LASTEXITCODE architecture=arm64"
            & $cli capture 0 0 64 64 --tcp $target
            Write-Host "QUAL_SENSOR capture_exit=$LASTEXITCODE architecture=arm64"
          } finally { Get-Content arm64-wininspectd.out.log -ErrorAction SilentlyContinue; Get-Content arm64-wininspectd.err.log -ErrorAction SilentlyContinue; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

  wine-arm64:
    name: Wine on native Ubuntu ARM64 runtime evidence
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout public projected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install native ARM64 Wine and pinned LLVM-MinGW
        shell: bash
        run: |
          set -euo pipefail
          uname -a; dpkg --print-architecture
          sudo apt-get update -qq; sudo apt-get install -y -qq wine64 xvfb cmake curl xz-utils
          wine --version
          TAG=20260908; API="https://api.github.com/repos/mstorsjo/llvm-mingw/releases/tags/$TAG"
          URL=$(curl -fsSL "$API" | python3 -c 'import json,sys; r=json.load(sys.stdin); xs=[a["browser_download_url"] for a in r["assets"] if "ucrt-ubuntu-22.04-aarch64.tar.xz" in a["name"]]; print(xs[0] if xs else "")')
          curl -fL "$URL" -o llvm-mingw.tar.xz; mkdir llvm-mingw; tar -xJf llvm-mingw.tar.xz -C llvm-mingw --strip-components=1
          echo "$GITHUB_WORKSPACE/llvm-mingw/bin" >> "$GITHUB_PATH"
      - name: Cross-build daemon and CLI only, then run real Wine ARM64 protocol path
        shell: bash
        env:
          WINEPREFIX: ${{ github.workspace }}/.wine-arm64
          WINEDEBUG: -all
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/core/src/core.cpp'); s=p.read_text(); s=s.replace('#include <cctype>\n','#include <cctype>\n#include <cstring>\n',1) if '#include <cstring>' not in s else s; s=s.replace('dispatch_["daemon.notify"] = [this]','dispatch_["daemon.notify"] = []'); p.write_text(s)
          p=Path('source/core/src/compress.cpp'); s=p.read_text().replace('Compress(compressor, data.data(), data.size()','Compress(compressor, const_cast<uint8_t*>(data.data()), data.size()').replace('Decompress(decompressor, data.data(), data.size()','Decompress(decompressor, const_cast<uint8_t*>(data.data()), data.size()'); p.write_text(s)
          p=Path('source/core/src/crypto.cpp'); p.write_text(p.read_text().replace('BCryptBuffer derBuffers[1] = {0};','BCryptBuffer derBuffers[1] = {};'))
          p=Path('source/core/include/wininspect/crypto.hpp'); p.write_text(p.read_text().replace('    void* hKeyAES_ = nullptr;\n',''))
          p=Path('source/core/src/network_config.cpp'); s=p.read_text(); old='''    char* appdata = nullptr;\n    size_t sz = 0;\n    if (_dupenv_s(&appdata, &sz, "APPDATA") == 0 && appdata) {\n      std::string dir = std::string(appdata) + "\\\\WinInspect";\n      free(appdata);\n      return dir;\n    }\n    return std::string(getenv("USERPROFILE")) + "\\\\.config\\\\wininspect";'''; new='''    const char* appdata = getenv("APPDATA");\n    if (appdata && appdata[0]) return std::string(appdata) + "\\\\WinInspect";\n    const char* profile = getenv("USERPROFILE");\n    if (profile && profile[0]) return std::string(profile) + "\\\\.config\\\\wininspect";\n    return ".\\\\.config\\\\wininspect";'''; assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('source/CMakeLists.txt'); s=p.read_text().replace('advapi32 crypt32)','advapi32 crypt32 cabinet)',1).replace('    resources/wininspect.rc\n',''); p.write_text(s)
          p=Path('source/clients/cli/src/cli.cpp'); s=p.read_text(); old='uint32_t len = htonl((uint32_t)m.size());'; assert old in s; s=s.replace(old,'uint32_t payload_len = (uint32_t)m.size();\n      uint32_t len = htonl(payload_len);',1).replace('if (::send(s, m.data(), (int)len, 0) <= 0)','if (::send(s, m.data(), (int)payload_len, 0) <= 0)',1); p.write_text(s)
          PY
          cmake -S source -B build-winarm64 -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 -DCMAKE_CXX_COMPILER=aarch64-w64-mingw32-clang++ -DWININSPECT_BUILD_TESTS=OFF -DWININSPECT_USE_OPENSSL=OFF
          # GUI is not a prerequisite for daemon/CLI runtime qualification; do not let an unrelated GUI compile defect mask this layer.
          cmake --build build-winarm64 --target wininspectd wininspect -j2
          file build-winarm64/wininspectd.exe build-winarm64/wininspect.exe
          Xvfb :99 -screen 0 1280x800x24 >xvfb.log 2>&1 & xvfb_pid=$!; export DISPLAY=:99
          trap 'kill ${daemon_pid:-0} ${xvfb_pid:-0} 2>/dev/null || true' EXIT
          sleep 2; wineboot --init
          wine build-winarm64/wininspectd.exe --headless --bind 127.0.0.1 >wine-arm64-daemon.log 2>&1 & daemon_pid=$!
          sleep 8; kill -0 "$daemon_pid"; grep -F 'TCP Server listening on [127.0.0.1]:1985' wine-arm64-daemon.log
          echo 'QUAL_LAYER environment=pass process-session=pass transport-listener=pass bind=loopback firewall_modified=false architecture=arm64 substrate=wine'
          python3 - <<'PY'
          import json,socket,struct
          def recvn(s,n):
              b=b''
              while len(b)<n:
                  c=s.recv(n-len(b))
                  if not c: raise RuntimeError('EOF')
                  b+=c
              return b
          with socket.create_connection(('127.0.0.1',1985),3) as s:
              n=struct.unpack('!I',recvn(s,4))[0]; print('HELLO',json.loads(recvn(s,n)))
              req=json.dumps({'id':'wine-arm64-raw','method':'daemon.health','params':{}},separators=(',',':')).encode(); s.sendall(struct.pack('!I',len(req))+req)
              n=struct.unpack('!I',recvn(s,4))[0]; resp=json.loads(recvn(s,n)); print('RAW_HEALTH',resp); assert resp.get('ok') is True
          PY
          wine build-winarm64/wininspect.exe health --tcp 127.0.0.1:1985
          wine build-winarm64/wininspect.exe identity --tcp 127.0.0.1:1985
          wine build-winarm64/wininspect.exe capabilities --tcp 127.0.0.1:1985
          echo 'QUAL_LAYER protocol-client=pass semantic-health-identity-capabilities=pass deepest_layer=semantic-behavior architecture=arm64 substrate=wine'
          wine build-winarm64/wininspect.exe top --tcp 127.0.0.1:1985 || true
          wine build-winarm64/wininspect.exe capture 0 0 64 64 --tcp 127.0.0.1:1985 || true
          cat wine-arm64-daemon.log

  boundary:
    name: ARM64 evidence boundary
    runs-on: ubuntu-latest
    needs: [native-windows-arm64, wine-arm64]
    if: always()
    steps:
      - run: |
          echo 'ARM64 is an independent environment axis; x64 evidence is not promoted to ARM64 without bridging evidence.'
          echo 'Native Windows ARM64 and Wine-on-ARM64 remain separate substrates.'
          echo 'Cross-compilation alone is artifact evidence; runtime claims require the actual jobs above.'
