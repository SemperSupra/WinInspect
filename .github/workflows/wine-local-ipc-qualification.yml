name: Phase 1 Wine 11 mouse Raw Input A/B

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wine-local-ipc-qualification.yml'
      - 'experiments/wine-local-ipc/**'
      - 'experiments/wine-uinput/wine_input_probe.cpp'
      - 'experiments/wine-uinput/sendinput_control.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wine11-mouse-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wine-report-e2e:
    name: Wine 11.17 mouse Raw Input A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out public experiment plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install only required fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo modprobe uinput
          test -c /dev/uinput

          packages=(xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-input-libinput xinput x11-xserver-utils x11-utils openbox gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64-posix)
          install=()
          for pkg in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed' || install+=("$pkg")
          done
          if [ "${#install[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${install[@]}"
          fi

          sudo dpkg --add-architecture i386
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qO /etc/apt/sources.list.d/winehq-noble.sources https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          apt-cache policy winehq-devel wine-devel wine-devel-amd64 wine-devel-i386 > evidence/winehq-policy.txt
          sudo apt-get install -y --install-recommends winehq-devel
          {
            dpkg -L winehq-devel
            dpkg -L wine-devel
            dpkg -L wine-devel-amd64
            dpkg -L wine-devel-i386
          } | sort -u > evidence/winehq-package-files.txt

          wine_bin=''
          for candidate in /opt/wine-devel/bin/wine /opt/wine-devel/bin/wine64; do
            if [ -x "$candidate" ]; then
              wine_bin="$candidate"
              break
            fi
          done
          if [ -z "$wine_bin" ]; then
            echo 'WineHQ development binary not found or not executable' >&2
            ls -la /opt/wine-devel/bin > evidence/winehq-bin-list.txt 2>&1 || true
            exit 2
          fi
          version=$("$wine_bin" --version)
          echo "$wine_bin" > evidence/wine-bin.txt
          {
            echo "experiment=wininspect-382-wine11-mouse-ab"
            echo "kernel=$(uname -r)"
            echo "uid=$(id -u)"
            echo "gid=$(id -g)"
            echo "wine_bin=$wine_bin"
            echo "wine_version=$version"
            x86_64-w64-mingw32-g++ --version | head -1
          } > evidence/environment.txt
          printf '%s\n' "$version" | grep -Eq '^wine-11\.(1[4-9]|[2-9][0-9])' || {
            echo "Expected Wine 11.14+ for raw-mouse A/B, got $version" >&2
            exit 3
          }

      - name: Build provider, corpus client, and established Wine controls
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror             experiments/wine-local-ipc/drop_priv_report_server.c             -o evidence/drop-priv-report-server

          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -static -static-libgcc             experiments/wine-local-ipc/win32_report_subset_client.c             -lws2_32 -o evidence/win32-report-subset-client.exe

          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -static-libgcc -static-libstdc++             experiments/wine-uinput/wine_input_probe.cpp             -o evidence/wine_input_probe.exe -luser32
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -static-libgcc -static-libstdc++             experiments/wine-uinput/sendinput_control.cpp             -o evidence/sendinput_control.exe -luser32

          sha256sum evidence/drop-priv-report-server evidence/win32-report-subset-client.exe             evidence/wine_input_probe.exe evidence/sendinput_control.exe             experiments/wine-local-ipc/conformance-subset.json > evidence/fixture-sha256.txt

      - name: Run idle, SendInput, and report-provider treatment in one Wine session
        id: treatment
        shell: bash
        continue-on-error: true
        run: |
          set +e

          wine_bin=$(cat evidence/wine-bin.txt)
          export PATH="$(dirname "$wine_bin"):$PATH"
          export WINEARCH=win64
          export WINEPREFIX="$RUNNER_TEMP/wininspect-wineprefix"
          export WINEDEBUG=-all
          rm -rf "$WINEPREFIX"

          preflight='not-run'
          timeout 45s "$(dirname "$wine_bin")/wineboot" -u > evidence/wineboot-preflight.txt 2>&1
          wineboot_rc=$?
          if [ "$wineboot_rc" -eq 0 ]; then
            timeout 20s "$wine_bin" cmd /c exit > evidence/wine-cmd-preflight.txt 2>&1
            winecmd_rc=$?
          else
            winecmd_rc=125
          fi
          timeout 10s "$(dirname "$wine_bin")/wineserver" -w > evidence/wineserver-preflight.txt 2>&1
          wineserver_rc=$?

          printf 'wineboot_rc=%d\nwinecmd_rc=%d\nwineserver_rc=%d\n' "$wineboot_rc" "$winecmd_rc" "$wineserver_rc" > evidence/wine-preflight-status.txt
          if [ "$wineboot_rc" -ne 0 ] || [ "$winecmd_rc" -ne 0 ]; then
            printf '{"classification":"wine11-prefix-preflight-failed","wineboot_exit_code":%d,"winecmd_exit_code":%d,"wineserver_exit_code":%d}\n'               "$wineboot_rc" "$winecmd_rc" "$wineserver_rc" > evidence/e2e-result.json
            cat evidence/e2e-result.json
            exit 1
          fi

          cat > evidence/xorg.conf <<'EOF'
          Section "ServerFlags"
              Option "AutoAddDevices" "true"
              Option "AutoEnableDevices" "true"
              Option "AllowMouseOpenFail" "true"
              Option "DontVTSwitch" "true"
          EndSection
          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 5.0 - 1000.0
              VertRefresh 5.0 - 200.0
              Modeline "1024x768" 65.0 1024 1048 1184 1344 768 771 777 806
          EndSection
          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1024x768"
              EndSubSection
          EndSection
          Section "ServerLayout"
              Identifier "DummyLayout"
              Screen "DummyScreen"
          EndSection
          EOF

          uid=$(id -u)
          gid=$(id -g)
          token=$(openssl rand -hex 32)
          sudo "$PWD/evidence/drop-priv-report-server" "$uid" "$gid" "$token"             > evidence/provider.txt 2> evidence/provider.err &
          provider_pid=$!

          ready=false
          for _ in $(seq 1 80); do
            grep -q '^READY ' evidence/provider.txt 2>/dev/null && { ready=true; break; }
            sudo kill -0 "$provider_pid" 2>/dev/null || break
            sleep 0.1
          done
          if [ "$ready" != true ]; then
            echo '{"classification":"provider-not-ready"}' > evidence/e2e-result.json
            exit 1
          fi
          ready_line=$(grep '^READY ' evidence/provider.txt | tail -1)
          port=$(printf '%s\n' "$ready_line" | sed -n 's/.* port=\([0-9][0-9]*\).*/\1/p')
          peuid=$(printf '%s\n' "$ready_line" | sed -n 's/.* euid=\([0-9][0-9]*\).*/\1/p')
          pegid=$(printf '%s\n' "$ready_line" | sed -n 's/.* egid=\([0-9][0-9]*\).*/\1/p')
          if [ "$peuid" != "$uid" ] || [ "$pegid" != "$gid" ]; then
            echo '{"classification":"provider-not-unprivileged"}' > evidence/e2e-result.json
            exit 1
          fi

          sudo Xorg :99 -noreset -nolisten tcp -ac -config "$PWD/evidence/xorg.conf"             -logfile "$PWD/evidence/Xorg.log" > evidence/xorg-stdout.txt 2>&1 &
          xorg_pid=$!
          openbox_pid=''
          wine_pid=''
          xi2_pid=''

          cleanup() {
            [ -n "${wine_pid:-}" ] && kill "$wine_pid" 2>/dev/null || true
            command -v wineserver >/dev/null 2>&1 && wineserver -k 2>/dev/null || true
            [ -n "${openbox_pid:-}" ] && kill "$openbox_pid" 2>/dev/null || true
            [ -n "${xi2_pid:-}" ] && kill "$xi2_pid" 2>/dev/null || true
            [ -n "${xorg_pid:-}" ] && sudo kill "$xorg_pid" 2>/dev/null || true
            sudo kill "$provider_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          x_ready=false
          for _ in $(seq 1 30); do
            DISPLAY=:99 xset q >/dev/null 2>&1 && { x_ready=true; break; }
            sleep 0.25
          done
          if [ "$x_ready" != true ]; then
            echo '{"classification":"xorg-start-failed"}' > evidence/e2e-result.json
            exit 1
          fi

          export DISPLAY=:99
          openbox --sm-disable > evidence/openbox.log 2>&1 &
          openbox_pid=$!
          sleep 1

          xinput list > evidence/xinput-list.txt 2>&1
          keyboard_xid=$(xinput list --id-only 'WinInspect-L2-Keyboard' 2>/dev/null || true)
          mouse_xid=$(xinput list --id-only 'WinInspect-L2-Mouse' 2>/dev/null || true)
          printf 'keyboard_xid=%s\nmouse_xid=%s\n' "$keyboard_xid" "$mouse_xid" > evidence/xinput-devices.txt
          if [ -z "$keyboard_xid" ] || [ -z "$mouse_xid" ]; then
            echo '{"classification":"xorg-did-not-consume-uinput-devices"}' > evidence/e2e-result.json
            exit 1
          fi

          "$wine_bin" "$PWD/evidence/wine_input_probe.exe" > evidence/probe.jsonl 2> evidence/probe.stderr &
          wine_pid=$!
          probe_ready=false
          for _ in $(seq 1 60); do
            grep -q '"event":"probe_ready"' evidence/probe.jsonl 2>/dev/null && { probe_ready=true; break; }
            kill -0 "$wine_pid" 2>/dev/null || break
            sleep 0.25
          done
          if [ "$probe_ready" != true ]; then
            echo '{"classification":"wine-probe-not-ready"}' > evidence/e2e-result.json
            exit 1
          fi

          idle_start=$(wc -l < evidence/probe.jsonl)
          sleep 2
          idle_end=$(wc -l < evidence/probe.jsonl)
          sed -n "$((idle_start+1)),${idle_end}p" evidence/probe.jsonl > evidence/phase-idle.jsonl

          "$wine_bin" "$PWD/evidence/sendinput_control.exe" > evidence/sendinput-control.txt 2>&1
          send_rc=$?
          sleep 0.75
          send_end=$(wc -l < evidence/probe.jsonl)
          sed -n "$((idle_end+1)),${send_end}p" evidence/probe.jsonl > evidence/phase-sendinput.jsonl

          "$wine_bin" "$PWD/evidence/sendinput_control.exe" --focus-only > evidence/focus-control.txt 2>&1
          focus_rc=$?
          sleep 0.25
          xprop -root _NET_ACTIVE_WINDOW > evidence/active-window.txt 2>&1 || true
          active_window=$(awk '{print $5}' evidence/active-window.txt 2>/dev/null)
          host_focus_ok=0
          if [ -n "${active_window:-}" ] && [ "$active_window" != "0x0" ]; then
            xprop -id "$active_window" WM_NAME _NET_WM_NAME > evidence/active-window-properties.txt 2>&1 || true
            grep -q 'WinInspect Input Probe' evidence/active-window-properties.txt && host_focus_ok=1
          fi

          before_treatment=$(wc -l < evidence/probe.jsonl)
          timeout 12s xinput test-xi2 --root > evidence/xinput2-treatment.txt 2>&1 &
          xi2_pid=$!
          sleep 0.25

          timeout 20s "$wine_bin" "$PWD/evidence/win32-report-subset-client.exe" "$port" "$token"             > evidence/report-client.txt 2> evidence/report-client.err
          client_rc=$?
          sleep 1
          treatment_end=$(wc -l < evidence/probe.jsonl)
          sed -n "$((before_treatment+1)),${treatment_end}p" evidence/probe.jsonl > evidence/phase-treatment.jsonl

          wait "$provider_pid"
          provider_rc=$?
          sleep 0.25
          kill "$xi2_pid" 2>/dev/null || true
          wait "$xi2_pid" 2>/dev/null || true

          idle_events=$(grep -Ec '"event":"(raw_input|key_message|edit_changed)"' evidence/phase-idle.jsonl || true)
          send_events=$(grep -Ec '"event":"(raw_input|key_message|edit_changed)"' evidence/phase-sendinput.jsonl || true)
          raw_keyboard=$(grep -Ec '"event":"raw_input".*"type":"keyboard"' evidence/phase-treatment.jsonl || true)
          raw_mouse=$(grep -Ec '"event":"raw_input".*"type":"mouse"' evidence/phase-treatment.jsonl || true)
          key_messages=$(grep -Ec '"event":"key_message"' evidence/phase-treatment.jsonl || true)
          edit_changes=$(grep -Ec '"event":"edit_changed"' evidence/phase-treatment.jsonl || true)
          xi2_keys=$(grep -Ec 'RawKeyPress|RawKeyRelease' evidence/xinput2-treatment.txt || true)
          xi2_mouse=$(grep -Ec 'RawMotion|RawButtonPress|RawButtonRelease' evidence/xinput2-treatment.txt || true)

          provider_result=$(grep '^RESULT ' evidence/provider.txt | tail -1)
          accepted=$(printf '%s\n' "$provider_result" | sed -n 's/.* accepted=\([0-9][0-9]*\).*/\1/p')
          rejected=$(printf '%s\n' "$provider_result" | sed -n 's/.* rejected=\([0-9][0-9]*\).*/\1/p')
          disconnect_release=$(printf '%s\n' "$provider_result" | sed -n 's/.* disconnect_release=\([0-9][0-9]*\).*/\1/p')

          grep '"event":"raw_input"' evidence/phase-treatment.jsonl | grep -o '"hDevice":"[^"]*"' | sort -u > evidence/treatment-device-handles.txt || true
          raw_handle_count=$(grep -c . evidence/treatment-device-handles.txt || true)

          if [ "$idle_events" -ne 0 ]; then
            classification='idle-control-contaminated'
          elif [ "$send_rc" -ne 0 ] || [ "$send_events" -eq 0 ]; then
            classification='sendinput-control-invalid'
          elif [ "$focus_rc" -ne 0 ] || [ "$host_focus_ok" -ne 1 ]; then
            classification='host-focus-control-invalid'
          elif [ "$client_rc" -ne 0 ] || [ "$provider_rc" -ne 0 ] || [ "$accepted" != '15' ] || [ "$rejected" != '2' ]; then
            classification='report-treatment-provider-failed'
          elif [ "$xi2_keys" -lt 4 ] || [ "$xi2_mouse" -lt 2 ]; then
            classification='xorg-did-not-observe-report-treatment'
          elif [ "$raw_keyboard" -lt 4 ] || [ "$raw_mouse" -lt 1 ]; then
            classification='wine11-rawinput-did-not-observe-report-treatment'
          elif [ "$edit_changes" -lt 1 ]; then
            classification='wine-app-text-semantics-incomplete'
          elif [ "$disconnect_release" != '1' ]; then
            classification='disconnect-release-not-recorded'
          else
            classification='wine11-mouse-rawinput-pass'
          fi

          key_message_observer_variance=0
          if [ "$key_messages" -lt 2 ]; then
            key_message_observer_variance=1
          fi

          printf '{"classification":"%s","idle_events":%d,"sendinput_exit_code":%d,"sendinput_events":%d,"focus_exit_code":%d,"host_focus_ok":%d,"report_client_exit_code":%d,"provider_exit_code":%d,"accepted":"%s","rejected":"%s","disconnect_release":"%s","xinput2_key_events":%d,"xinput2_mouse_events":%d,"wine_raw_keyboard":%d,"wine_raw_mouse":%d,"wine_key_messages":%d,"wine_edit_changes":%d,"wine_raw_device_handle_count":%d,"key_message_observer_variance":%d}\n'             "$classification" "$idle_events" "$send_rc" "$send_events" "$focus_rc" "$host_focus_ok"             "$client_rc" "$provider_rc" "$accepted" "$rejected" "$disconnect_release"             "$xi2_keys" "$xi2_mouse" "$raw_keyboard" "$raw_mouse" "$key_messages" "$edit_changes" "$raw_handle_count" "$key_message_observer_variance"             > evidence/e2e-result.json
          cat evidence/e2e-result.json
          [ "$classification" = 'wine11-mouse-rawinput-pass' ]

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase1-wine11-mouse-ab
          path: evidence/
          if-no-files-found: error
          retention-days: 14
