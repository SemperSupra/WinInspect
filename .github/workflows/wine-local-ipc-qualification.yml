name: Phase 1 Wine local privilege boundary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wine-local-ipc-qualification.yml'
      - 'experiments/wine-local-ipc/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wine-local-privilege-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drop-priv-loopback:
    name: Wine authenticated loopback + post-drop uinput
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public experiment plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install minimal dependencies and qualify uinput availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo modprobe uinput
          test -c /dev/uinput
          ls -l /dev/uinput > evidence/uinput-device.txt

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine64 gcc-mingw-w64-x86-64

          wine_bin=$(command -v wine64 || command -v wine || find /usr/lib/wine -maxdepth 1 -type f -name wine64 -print -quit)
          if [ -z "$wine_bin" ]; then
            echo 'wine executable not found after package install' >&2
            exit 2
          fi
          echo "$wine_bin" > evidence/wine-bin.txt
          {
            echo "experiment=wininspect-382-wine-drop-priv-uinput"
            echo "kernel=$(uname -r)"
            echo "uid=$(id -u)"
            echo "gid=$(id -g)"
            "$wine_bin" --version
            x86_64-w64-mingw32-gcc --version | head -1
          } > evidence/environment.txt

      - name: Build drop-privilege server and Win32 client
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror             experiments/wine-local-ipc/drop_priv_uinput_server.c             -o evidence/drop-priv-uinput-server

          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -static -static-libgcc             experiments/wine-local-ipc/win32_loopback_client.c             -lws2_32 -o evidence/win32-loopback-client.exe

          sha256sum evidence/drop-priv-uinput-server evidence/win32-loopback-client.exe             > evidence/fixture-sha256.txt
          x86_64-w64-mingw32-objdump -p evidence/win32-loopback-client.exe |
            sed -n '/DLL Name/p' > evidence/client-imports.txt

      - name: Qualify post-drop uinput authority boundary
        id: treatment
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          export WINEPREFIX="$RUNNER_TEMP/wininspect-drop-priv-prefix"
          mkdir -p "$WINEPREFIX"
          wine_bin=$(cat evidence/wine-bin.txt)
          "$wine_bin" wineboot.exe -u > evidence/wineboot.txt 2>&1 || true

          uid=$(id -u)
          gid=$(id -g)
          token=$(openssl rand -hex 32)

          sudo "$PWD/evidence/drop-priv-uinput-server" "$uid" "$gid" "$token"             > evidence/server.txt 2> evidence/server.err &
          server_pid=$!

          cleanup() {
            sudo kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 80); do
            if grep -q '^READY ' evidence/server.txt 2>/dev/null; then
              ready=true
              break
            fi
            if ! sudo kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [ "$ready" != true ]; then
            printf '{"classification":"drop-priv-server-not-ready"}\n' > evidence/result.json
            exit 1
          fi

          ready_line=$(grep '^READY ' evidence/server.txt | tail -1)
          port=$(printf '%s\n' "$ready_line" | sed -n 's/.* port=\([0-9][0-9]*\).*/\1/p')
          server_euid=$(printf '%s\n' "$ready_line" | sed -n 's/.* euid=\([0-9][0-9]*\).*/\1/p')
          server_egid=$(printf '%s\n' "$ready_line" | sed -n 's/.* egid=\([0-9][0-9]*\).*/\1/p')
          if [ -z "$port" ] || [ "$server_euid" != "$uid" ] || [ "$server_egid" != "$gid" ]; then
            printf '{"classification":"privilege-drop-not-proven","server_euid":"%s","server_egid":"%s","expected_uid":"%s","expected_gid":"%s"}\n'               "$server_euid" "$server_egid" "$uid" "$gid" > evidence/result.json
            exit 1
          fi

          set +e
          timeout 20s "$wine_bin" "$PWD/evidence/win32-loopback-client.exe" "$port" "$token"             > evidence/client.txt 2> evidence/client.err
          client_rc=$?

          server_done=false
          for _ in $(seq 1 80); do
            if ! sudo kill -0 "$server_pid" 2>/dev/null; then
              server_done=true
              break
            fi
            sleep 0.1
          done
          if [ "$server_done" != true ]; then
            sudo kill "$server_pid" 2>/dev/null || true
          fi
          wait "$server_pid"
          server_rc=$?
          set -e

          post_drop_input=$(sed -n 's/.*post_drop_input=\([0-9][0-9]*\).*/\1/p' evidence/server.txt | tail -1)
          result_euid=$(sed -n 's/.* euid=\([0-9][0-9]*\).*/\1/p' evidence/server.txt | tail -1)
          result_egid=$(sed -n 's/.* egid=\([0-9][0-9]*\).*/\1/p' evidence/server.txt | tail -1)
          keyboard_destroy=$(sed -n 's/.*keyboard_destroy=\(-*[0-9][0-9]*\).*/\1/p' evidence/server.txt | tail -1)
          mouse_destroy=$(sed -n 's/.*mouse_destroy=\(-*[0-9][0-9]*\).*/\1/p' evidence/server.txt | tail -1)

          if [ "$client_rc" -eq 0 ] && [ "$server_rc" -eq 0 ] &&
             [ "$post_drop_input" = "1" ] &&
             [ "$result_euid" = "$uid" ] && [ "$result_egid" = "$gid" ] &&
             [ "$keyboard_destroy" = "0" ] && [ "$mouse_destroy" = "0" ]; then
            classification='wine-loopback-auth-post-drop-uinput-pass'
          elif [ "$client_rc" -ne 0 ]; then
            classification='wine-loopback-client-failed'
          elif [ "$post_drop_input" != "1" ]; then
            classification='post-drop-uinput-write-failed'
          elif [ "$result_euid" != "$uid" ] || [ "$result_egid" != "$gid" ]; then
            classification='privilege-drop-not-maintained'
          else
            classification='drop-priv-uinput-inconclusive'
          fi

          printf '{"classification":"%s","client_exit_code":%d,"server_exit_code":%d,"server_euid":"%s","server_egid":"%s","post_drop_input":"%s","keyboard_destroy":"%s","mouse_destroy":"%s"}\n'             "$classification" "$client_rc" "$server_rc" "$result_euid" "$result_egid"             "$post_drop_input" "$keyboard_destroy" "$mouse_destroy" > evidence/result.json
          cat evidence/result.json
          [ "$classification" = 'wine-loopback-auth-post-drop-uinput-pass' ]

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase1-wine-drop-priv-uinput
          path: evidence/
          if-no-files-found: error
          retention-days: 14
