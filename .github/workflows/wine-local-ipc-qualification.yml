name: Phase 2 Wine full virtual-input conformance

on:
  # Phase 2 is qualified; preserve it as a manual regression oracle.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wine-full-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-conformance:
    name: Canonical keyboard and mouse corpus through Wine
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out public experiment plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install bounded qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo modprobe uinput
          test -c /dev/uinput
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc gcc-mingw-w64-x86-64 evtest python3 wget

          sudo dpkg --add-architecture i386
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qO /etc/apt/sources.list.d/winehq-noble.sources https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y --install-recommends winehq-devel

          wine_bin=''
          for candidate in /opt/wine-devel/bin/wine /opt/wine-devel/bin/wine64; do
            if [ -x "$candidate" ]; then wine_bin="$candidate"; break; fi
          done
          test -n "$wine_bin"
          echo "$wine_bin" > evidence/wine-bin.txt
          {
            echo "experiment=wininspect-382-phase2-full-conformance"
            echo "kernel=$(uname -r)"
            echo "uid=$(id -u)"
            echo "gid=$(id -g)"
            "$wine_bin" --version
          } > evidence/environment.txt

      - name: Build provider and generated Win32 corpus client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/wine-local-ipc/generate_full_conformance_client.py experiments/wine-local-ipc/verify_full_conformance.py

          python3 experiments/wine-local-ipc/generate_full_conformance_client.py experiments/wine-local-ipc/full-conformance.json evidence/win32-full-conformance-client.c evidence/generated-summary.json

          gcc -std=c11 -O2 -Wall -Wextra -Werror             experiments/wine-local-ipc/drop_priv_report_server.c             -o evidence/drop-priv-report-server

          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -static -static-libgcc             evidence/win32-full-conformance-client.c -lws2_32             -o evidence/win32-full-conformance-client.exe

          sha256sum             experiments/wine-local-ipc/full-conformance.json             experiments/wine-local-ipc/drop_priv_report_server.c             evidence/win32-full-conformance-client.c             evidence/win32-full-conformance-client.exe             > evidence/fixture-sha256.txt

      - name: Run full canonical corpus with evdev observation
        id: treatment
        shell: bash
        continue-on-error: true
        run: |
          set +e
          wine_bin=$(cat evidence/wine-bin.txt)
          export PATH="$(dirname "$wine_bin"):$PATH"
          export WINEARCH=win64
          export WINEPREFIX="$RUNNER_TEMP/wininspect-full-conformance-prefix"
          export WINEDEBUG=-all
          rm -rf "$WINEPREFIX"

          timeout 45s "$(dirname "$wine_bin")/wineboot" -u > evidence/wineboot.txt 2>&1
          wineboot_rc=$?
          if [ "$wineboot_rc" -eq 0 ]; then
            timeout 20s "$wine_bin" cmd /c exit > evidence/wine-cmd.txt 2>&1
            winecmd_rc=$?
          else
            winecmd_rc=125
          fi
          if [ "$wineboot_rc" -ne 0 ] || [ "$winecmd_rc" -ne 0 ]; then
            printf '{"classification":"wine-prefix-preflight-failed","wineboot_exit_code":%d,"winecmd_exit_code":%d}\n' "$wineboot_rc" "$winecmd_rc" > evidence/result.json
            exit 1
          fi

          uid=$(id -u)
          gid=$(id -g)
          token=$(openssl rand -hex 32)

          sudo "$PWD/evidence/drop-priv-report-server" "$uid" "$gid" "$token"             > evidence/provider.txt 2> evidence/provider.err &
          provider_pid=$!
          kbd_observer=''
          mouse_observer=''
          cleanup() {
            sudo kill "$provider_pid" 2>/dev/null || true
            [ -n "${kbd_observer:-}" ] && sudo kill "$kbd_observer" 2>/dev/null || true
            [ -n "${mouse_observer:-}" ] && sudo kill "$mouse_observer" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 100); do
            grep -q '^READY ' evidence/provider.txt 2>/dev/null && { ready=true; break; }
            sudo kill -0 "$provider_pid" 2>/dev/null || break
            sleep 0.1
          done
          if [ "$ready" != true ]; then
            echo '{"classification":"provider-not-ready"}' > evidence/result.json
            exit 1
          fi

          ready_line=$(grep '^READY ' evidence/provider.txt | tail -1)
          port=$(printf '%s\n' "$ready_line" | sed -n 's/.* port=\([0-9][0-9]*\).*/\1/p')
          peuid=$(printf '%s\n' "$ready_line" | sed -n 's/.* euid=\([0-9][0-9]*\).*/\1/p')
          pegid=$(printf '%s\n' "$ready_line" | sed -n 's/.* egid=\([0-9][0-9]*\).*/\1/p')
          if [ "$peuid" != "$uid" ] || [ "$pegid" != "$gid" ]; then
            echo '{"classification":"provider-not-unprivileged"}' > evidence/result.json
            exit 1
          fi

          keyboard_event=''
          mouse_event=''
          for _ in $(seq 1 100); do
            for namefile in /sys/class/input/event*/device/name; do
              [ -f "$namefile" ] || continue
              name=$(cat "$namefile")
              event=$(basename "$(dirname "$(dirname "$namefile")")")
              [ "$name" = 'WinInspect-L2-Keyboard' ] && keyboard_event="$event"
              [ "$name" = 'WinInspect-L2-Mouse' ] && mouse_event="$event"
            done
            [ -n "$keyboard_event" ] && [ -n "$mouse_event" ] && break
            sleep 0.1
          done
          printf 'keyboard_event=%s\nmouse_event=%s\n' "$keyboard_event" "$mouse_event" > evidence/event-devices.txt
          if [ -z "$keyboard_event" ] || [ -z "$mouse_event" ]; then
            echo '{"classification":"uinput-event-devices-not-found"}' > evidence/result.json
            exit 1
          fi

          sudo timeout 45s evtest "/dev/input/$keyboard_event" > evidence/keyboard-evtest.txt 2>&1 &
          kbd_observer=$!
          sudo timeout 45s evtest "/dev/input/$mouse_event" > evidence/mouse-evtest.txt 2>&1 &
          mouse_observer=$!
          sleep 0.5

          timeout 35s "$wine_bin" "$PWD/evidence/win32-full-conformance-client.exe" "$port" "$token"             > evidence/client.txt 2> evidence/client.err
          client_rc=$?

          provider_done=false
          for _ in $(seq 1 100); do
            if ! sudo kill -0 "$provider_pid" 2>/dev/null; then provider_done=true; break; fi
            sleep 0.1
          done
          if [ "$provider_done" != true ]; then sudo kill "$provider_pid" 2>/dev/null || true; fi
          wait "$provider_pid"
          provider_rc=$?

          sleep 0.5
          sudo kill "$kbd_observer" "$mouse_observer" 2>/dev/null || true
          wait "$kbd_observer" 2>/dev/null || true
          wait "$mouse_observer" 2>/dev/null || true

          python3 experiments/wine-local-ipc/verify_full_conformance.py             experiments/wine-local-ipc/full-conformance.json             experiments/wine-local-ipc/drop_priv_report_server.c             evidence/keyboard-evtest.txt evidence/mouse-evtest.txt             evidence/observation-result.json
          observe_rc=$?

          result_line=$(grep '^RESULT ' evidence/provider.txt | tail -1)
          accepted=$(printf '%s\n' "$result_line" | sed -n 's/.* accepted=\([0-9][0-9]*\).*/\1/p')
          rejected=$(printf '%s\n' "$result_line" | sed -n 's/.* rejected=\([0-9][0-9]*\).*/\1/p')
          disconnect_release=$(printf '%s\n' "$result_line" | sed -n 's/.* disconnect_release=\([0-9][0-9]*\).*/\1/p')
          expected_accepted=$(python3 -c 'import json;print(json.load(open("evidence/generated-summary.json"))["accepted"])')
          expected_rejected=$(python3 -c 'import json;print(json.load(open("evidence/generated-summary.json"))["rejected"])')

          if [ "$client_rc" -eq 0 ] && [ "$provider_rc" -eq 0 ] && [ "$observe_rc" -eq 0 ] &&
             [ "$accepted" = "$expected_accepted" ] && [ "$rejected" = "$expected_rejected" ] &&
             [ "$disconnect_release" = '1' ]; then
            classification='wine-phase2-full-report-conformance-pass'
          elif [ "$client_rc" -ne 0 ]; then
            classification='full-conformance-client-failed'
          elif [ "$provider_rc" -ne 0 ]; then
            classification='full-conformance-provider-failed'
          elif [ "$observe_rc" -ne 0 ]; then
            classification='full-conformance-observation-failed'
          else
            classification='full-conformance-count-mismatch'
          fi

          printf '{"classification":"%s","client_exit_code":%d,"provider_exit_code":%d,"observation_exit_code":%d,"accepted":"%s","expected_accepted":"%s","rejected":"%s","expected_rejected":"%s","disconnect_release":"%s"}\n'             "$classification" "$client_rc" "$provider_rc" "$observe_rc" "$accepted" "$expected_accepted" "$rejected" "$expected_rejected" "$disconnect_release"             > evidence/result.json
          cat evidence/result.json
          [ "$classification" = 'wine-phase2-full-report-conformance-pass' ]

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase2-wine-full-conformance
          path: evidence/
          if-no-files-found: error
          retention-days: 14
