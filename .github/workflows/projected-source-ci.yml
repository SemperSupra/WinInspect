name: Projected source CI

on:
  pull_request:
    paths:
      - 'source/**'
      - '.projection/**'
      - 'scripts/Test-ProjectedSource.ps1'
      - 'scripts/Test-ProjectedSourcePathSafety.ps1'
      - 'scripts/Test-PublicDeployPlane.ps1'
      - '.github/workflows/projected-source-ci.yml'
      - '.github/workflows/release.yml'
      - 'README.md'
      - 'scripts/public-browser-**'
      - 'docs/**'
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.projection/**'
      - 'scripts/Test-ProjectedSource.ps1'
      - 'scripts/Test-ProjectedSourcePathSafety.ps1'
      - 'scripts/Test-PublicDeployPlane.ps1'
      - '.github/workflows/projected-source-ci.yml'
      - '.github/workflows/release.yml'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public deployment plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate public deploy-plane architecture
        shell: pwsh
        run: ./scripts/Test-PublicDeployPlane.ps1

      - name: Regression-test projected path safety
        shell: pwsh
        run: ./scripts/Test-ProjectedSourcePathSafety.ps1

      - name: Validate source projection receipt
        shell: pwsh
        run: ./scripts/Test-ProjectedSource.ps1

      - name: Detect projected source
        id: projection
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'source/CMakeLists.txt' -PathType Leaf) {
            'present=true' >> $env:GITHUB_OUTPUT
          } else {
            'present=false' >> $env:GITHUB_OUTPUT
          }

      - name: Build projected C++ source
        if: steps.projection.outputs.present == 'true'
        shell: pwsh
        run: |
          cmake -S source -B build -DWININSPECT_BUILD_TESTS=OFF -DWININSPECT_USE_OPENSSL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed.' }

      - name: Build projected portable client
        if: steps.projection.outputs.present == 'true'
        shell: pwsh
        run: |
          $goMod = Join-Path $env:GITHUB_WORKSPACE 'source/clients/portable/go.mod'
          if (-not (Test-Path -LiteralPath $goMod -PathType Leaf)) {
            Write-Host 'No projected Go portable client; skipping.'
            exit 0
          }
          go version
          go build -C source/clients/portable -o ../../../build/wi-portable-projected-win-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Projected portable client build failed.' }

      - name: Browser RDTE on approved public projection
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qualification/browser-')
        shell: pwsh
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}\public-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\public-browsers
          WININSPECT_DAEMON: ${{ github.workspace }}\build\Release\wininspectd.exe
          RDTE_RECEIPT: ${{ runner.temp }}\public-browser-rdte.json
        run: |
          if (-not (Test-Path -LiteralPath $env:WININSPECT_DAEMON)) { throw 'Projected binary missing' }
          New-Item -ItemType Directory -Force -Path $env:PLAYWRIGHT_MODULE_ROOT | Out-Null
          Copy-Item scripts/public-browser-rdte/package*.json $env:PLAYWRIGHT_MODULE_ROOT
          npm ci --prefix $env:PLAYWRIGHT_MODULE_ROOT --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned npm ci failed' }
          $pw = Join-Path $env:PLAYWRIGHT_MODULE_ROOT 'node_modules/.bin/playwright.cmd'
          & $pw install firefox
          if ($LASTEXITCODE -ne 0) { throw 'Playwright Firefox browser installation failed' }
          node --check scripts/public-browser-wininspect-observe.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native observer syntax invalid' }
          node --check scripts/public-browser-playwright-rdte.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Playwright harness syntax invalid' }
          node scripts/public-browser-playwright-rdte.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser RDTE failed; preserve receipt' }
      - name: Verify pinned competitor release provenance
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qualification/browser-')
        shell: pwsh
        run: ./scripts/public-browser-competitor-provenance.ps1

      - name: Archive sanitized browser RDTE results
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qualification/browser-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wininspect-browser-rdte
          path: |
            ${{ runner.temp }}\public-browser-rdte.json
            ${{ runner.temp }}\public-browser-competitor-provenance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record public execution boundary
        shell: pwsh
        run: |
          Write-Host 'This workflow validates and builds only sanitized projected source.'
          Write-Host 'Comprehensive/private development tests are intentionally not part of the public build graph.'
          Write-Host 'It has no credentials or network path capable of reading the private development repository.'
          Write-Host 'A successful public build does not imply private promotion approval.'
