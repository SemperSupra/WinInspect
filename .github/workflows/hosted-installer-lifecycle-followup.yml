name: Hosted Windows installer lifecycle follow-up

on:
  pull_request:
    paths:
      - '.github/workflows/hosted-installer-lifecycle-followup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-transition-and-input:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build release subjects
        shell: pwsh
        run: |
          cmake -S source -B source/build -A ${{ matrix.arch }} -DWININSPECT_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build source/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }

      - name: Package A and B
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE 'source\build\Release'
          $stageRoot = Join-Path $env:GITHUB_WORKSPACE 'source\dist\staging'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'source\dist'
          New-Item -ItemType Directory -Path $stageRoot -Force | Out-Null
          foreach ($name in @('wininspectd.exe','wininspect.exe','wininspect-gui.exe')) {
            $src = Join-Path $buildRoot $name
            if (-not (Test-Path $src -PathType Leaf)) { throw "Missing $src" }
            Copy-Item $src (Join-Path $stageRoot $name) -Force
          }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source }
          foreach ($version in @('hosted-a','hosted-b')) {
            & $makensis "/DVERSION=$version" "/DBUILD_SRC=$stageRoot" "/DDIST_DIR=$distRoot" (Join-Path $env:GITHUB_WORKSPACE 'source\tools\wininspect.nsi')
            if ($LASTEXITCODE -ne 0) { throw "makensis failed for $version." }
          }

      - name: Prove native A to B to A and corrupt-package rejection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'WinInspect'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WinInspect'

          function Install([string]$path) {
            $resolved = (Resolve-Path $path).Path
            $p = Start-Process $resolved -ArgumentList '/S' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Installer failed ($path): $($p.ExitCode)" }
          }
          function Assert-Version([string]$expected) {
            $actual = (Get-ItemProperty -LiteralPath $key -Name DisplayVersion -ErrorAction Stop).DisplayVersion
            if ($actual -ne $expected) { throw "Expected DisplayVersion $expected, got $actual" }
            $cli = Join-Path $root 'wininspect.exe'
            & $cli '--version' *> $null
            if ($LASTEXITCODE -ne 0) { throw "Installed CLI unhealthy at package version $expected." }
            return $actual
          }
          function Product-Hashes {
            $o = [ordered]@{}
            foreach ($name in @('wininspectd.exe','wininspect.exe','wininspect-gui.exe')) {
              $o[$name] = (Get-FileHash -LiteralPath (Join-Path $root $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            return $o
          }
          function Hashes-Equal($a,$b) {
            foreach ($name in @('wininspectd.exe','wininspect.exe','wininspect-gui.exe')) {
              if ($a[$name] -ne $b[$name]) { return $false }
            }
            return $true
          }

          Install './source/dist/WinInspect-Installer-hosted-a.exe'
          $a = Assert-Version 'hosted-a'
          $hashA = Product-Hashes

          Copy-Item './source/dist/WinInspect-Installer-hosted-b.exe' './source/dist/WinInspect-Installer-hosted-b-corrupt.exe' -Force
          $stream = [System.IO.File]::Open('./source/dist/WinInspect-Installer-hosted-b-corrupt.exe',[System.IO.FileMode]::Open,[System.IO.FileAccess]::Write,[System.IO.FileShare]::None)
          try { $stream.SetLength([Math]::Min(4096, $stream.Length)) } finally { $stream.Dispose() }
          $badExit = $null
          $badException = $null
          try {
            $bad = Start-Process (Resolve-Path './source/dist/WinInspect-Installer-hosted-b-corrupt.exe').Path -ArgumentList '/S' -PassThru -Wait
            $badExit = $bad.ExitCode
          } catch {
            $badException = $_.Exception.Message
          }
          $afterBad = Assert-Version 'hosted-a'
          $hashAfterBad = Product-Hashes
          $badRejected = (($null -ne $badException) -or ($badExit -ne 0)) -and (Hashes-Equal $hashA $hashAfterBad)
          if (-not $badRejected) { throw 'Corrupted package was not rejected while preserving the accepted A installation.' }

          Install './source/dist/WinInspect-Installer-hosted-b.exe'
          $b = Assert-Version 'hosted-b'
          Install './source/dist/WinInspect-Installer-hosted-a.exe'
          $rollback = Assert-Version 'hosted-a'
          $hashRollback = Product-Hashes
          if (-not (Hashes-Equal $hashA $hashRollback)) { throw 'A->B->A did not restore the exact same-source product binary set.' }

          [ordered]@{
            schemaVersion = 1
            runner = '${{ matrix.runner }}'
            architecture = '${{ matrix.arch }}'
            sourceIdentity = $env:GITHUB_SHA
            transition = @($a,$b,$rollback)
            corruptPackage = [ordered]@{
              exit = $badExit
              exception = $badException
              retainedVersion = $afterBad
              retainedHashes = (Hashes-Equal $hashA $hashAfterBad)
              status = 'passed'
            }
            exactRollback = $true
            verdict = 'passed'
            scope = 'same-source package-version transition and preflight corrupt-package recovery only; not historical cross-source rollback or mid-write recovery'
          } | ConvertTo-Json -Depth 8 | Set-Content "./followup-transition-${{ matrix.arch }}.json" -Encoding utf8NoBOM

      - name: Characterize corrected hosted SendInput keyboard path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class HostedInputProbeV2 {
              [StructLayout(LayoutKind.Sequential)]
              public struct INPUT { public uint type; public InputUnion U; }

              [StructLayout(LayoutKind.Explicit, Size=32)]
              public struct InputUnion {
                  [FieldOffset(0)] public MOUSEINPUT mi;
                  [FieldOffset(0)] public KEYBDINPUT ki;
                  [FieldOffset(0)] public HARDWAREINPUT hi;
              }

              [StructLayout(LayoutKind.Sequential)]
              public struct MOUSEINPUT {
                  public int dx; public int dy; public uint mouseData; public uint dwFlags; public uint time; public UIntPtr dwExtraInfo;
              }
              [StructLayout(LayoutKind.Sequential)]
              public struct KEYBDINPUT {
                  public ushort wVk; public ushort wScan; public uint dwFlags; public uint time; public UIntPtr dwExtraInfo;
              }
              [StructLayout(LayoutKind.Sequential)]
              public struct HARDWAREINPUT { public uint uMsg; public ushort wParamL; public ushort wParamH; }

              [DllImport("user32.dll", SetLastError=true)]
              public static extern uint SendInput(uint nInputs, INPUT[] pInputs, int cbSize);
              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool SetForegroundWindow(IntPtr hWnd);

              const uint INPUT_KEYBOARD=1, KEYEVENTF_KEYUP=0x0002, KEYEVENTF_UNICODE=0x0004;

              public static uint SendUnicode(string text, out int error) {
                  uint total=0; error=0;
                  foreach (char ch in text) {
                      INPUT[] items=new INPUT[2];
                      items[0].type=INPUT_KEYBOARD; items[0].U.ki.wScan=ch; items[0].U.ki.dwFlags=KEYEVENTF_UNICODE;
                      items[1].type=INPUT_KEYBOARD; items[1].U.ki.wScan=ch; items[1].U.ki.dwFlags=KEYEVENTF_UNICODE|KEYEVENTF_KEYUP;
                      uint sent=SendInput(2,items,Marshal.SizeOf(typeof(INPUT)));
                      if (sent!=2) { error=Marshal.GetLastWin32Error(); return total+sent; }
                      total+=sent;
                  }
                  return total;
              }
              public static uint Chord(ushort modifier, ushort key, out int error) {
                  INPUT[] items=new INPUT[4];
                  items[0].type=INPUT_KEYBOARD; items[0].U.ki.wVk=modifier;
                  items[1].type=INPUT_KEYBOARD; items[1].U.ki.wVk=key;
                  items[2].type=INPUT_KEYBOARD; items[2].U.ki.wVk=key; items[2].U.ki.dwFlags=KEYEVENTF_KEYUP;
                  items[3].type=INPUT_KEYBOARD; items[3].U.ki.wVk=modifier; items[3].U.ki.dwFlags=KEYEVENTF_KEYUP;
                  uint sent=SendInput(4,items,Marshal.SizeOf(typeof(INPUT)));
                  error=(sent==4)?0:Marshal.GetLastWin32Error(); return sent;
              }
              public static int InputSize() { return Marshal.SizeOf(typeof(INPUT)); }
          }
          '@

          $probe = 'WININSPECT_HOSTED_INPUT_PROBE_V2'
          $notepad = Start-Process notepad.exe -PassThru
          $result = [ordered]@{
            schemaVersion = 2
            runner = '${{ matrix.runner }}'
            architecture = '${{ matrix.arch }}'
            inputStructSize = [HostedInputProbeV2]::InputSize()
            mainWindow = $false
            uiaFocus = $false
            setForeground = $false
            unicodeEventsExpected = $probe.Length * 2
            unicodeEventsSent = 0
            unicodeLastError = 0
            selectEventsSent = 0
            selectLastError = 0
            copyEventsSent = 0
            copyLastError = 0
            observed = $null
            status = 'UNAVAILABLE'
            scope = 'hosted-runner user32.SendInput characterization only; not physical HID or controlled WinBot acceptance'
          }
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do { Start-Sleep -Milliseconds 250; $notepad.Refresh() } while ($notepad.MainWindowHandle -eq 0 -and -not $notepad.HasExited -and [DateTime]::UtcNow -lt $deadline)
            $result.mainWindow = ($notepad.MainWindowHandle -ne 0)
            if ($result.mainWindow) {
              try {
                $root = [System.Windows.Automation.AutomationElement]::FromHandle($notepad.MainWindowHandle)
                $target = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Document))
                if ($null -eq $target) {
                  $target = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Edit))
                }
                if ($null -ne $target) { $target.SetFocus(); $result.uiaFocus = $true }
              } catch {}
              $result.setForeground = [HostedInputProbeV2]::SetForegroundWindow($notepad.MainWindowHandle)
              Start-Sleep -Milliseconds 400
              $err = 0
              $result.unicodeEventsSent = [HostedInputProbeV2]::SendUnicode($probe,[ref]$err)
              $result.unicodeLastError = $err
              Start-Sleep -Milliseconds 300
              $err = 0; $result.selectEventsSent = [HostedInputProbeV2]::Chord(0x11,0x41,[ref]$err); $result.selectLastError = $err
              $err = 0; $result.copyEventsSent = [HostedInputProbeV2]::Chord(0x11,0x43,[ref]$err); $result.copyLastError = $err
              Start-Sleep -Milliseconds 500
              try { $result.observed = Get-Clipboard -Raw } catch {}
              if ($result.observed -eq $probe) { $result.status = 'PASS' }
              elseif ($result.unicodeEventsSent -eq 0) { $result.status = 'UNAVAILABLE' }
              else { $result.status = 'FAIL' }
            }
          } finally {
            if ($notepad -and -not $notepad.HasExited) { Stop-Process -Id $notepad.Id -Force -ErrorAction SilentlyContinue }
            $result | ConvertTo-Json -Depth 8 | Set-Content "./followup-sendinput-${{ matrix.arch }}.json" -Encoding utf8NoBOM
            $result | ConvertTo-Json -Depth 8 | Write-Host
          }

      - name: Final cleanup
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'WinInspect'
          $u = Join-Path $root 'uninstall.exe'
          if (Test-Path $u) {
            $p = Start-Process $u -ArgumentList '/S' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "cleanup uninstall failed: $($p.ExitCode)" }
          }

      - name: Upload follow-up evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-lifecycle-followup-${{ matrix.arch }}
          path: |
            followup-transition-${{ matrix.arch }}.json
            followup-sendinput-${{ matrix.arch }}.json
          if-no-files-found: warn
          retention-days: 30
