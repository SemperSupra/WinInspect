name: Hosted native GUI accessibility conformance

on:
  pull_request:
    paths:
      - 'source/**'
      - 'experiments/Apply-HostedNativeHciRepair.ps1'
      - 'experiments/Normalize-HostedNativeHciLayout.ps1'
      - 'experiments/Normalize-HostedNativeKeyboardAccess.ps1'
      - 'experiments/Normalize-HostedNativeAccessibleNames.ps1'
      - 'scripts/Invoke-AxeWindowsConformance.ps1'
      - '.github/workflows/hosted-native-accessibility-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe-windows:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-server2025
            runner: windows-2025
            cmake_arch: x64
          - name: arm64-win11
            runner: windows-11-vs2026-arm
            cmake_arch: ARM64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout public deployment plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Apply exact HCI candidate
        shell: pwsh
        run: |
          ./experiments/Apply-HostedNativeHciRepair.ps1
          ./experiments/Normalize-HostedNativeHciLayout.ps1
          ./experiments/Normalize-HostedNativeKeyboardAccess.ps1
          ./experiments/Normalize-HostedNativeAccessibleNames.ps1
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'HCI candidate introduced whitespace errors.' }

      - name: Configure GUI
        shell: pwsh
        run: |
          cmake -S source -B build -A '${{ matrix.cmake_arch }}' -DWININSPECT_BUILD_TESTS=OFF -DWININSPECT_USE_OPENSSL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Build GUI
        shell: pwsh
        run: |
          cmake --build build --config Release --target wininspect-gui --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'WinInspect GUI build failed.' }

      - name: Run Microsoft Axe.Windows accessibility rules
        shell: pwsh
        run: |
          $gui = Get-ChildItem -Recurse build -Filter 'wininspect-gui.exe' | Select-Object -First 1
          if (-not $gui) { throw 'wininspect-gui.exe not found after build.' }
          ./scripts/Invoke-AxeWindowsConformance.ps1 -GuiPath $gui.FullName -OutputDirectory 'evidence/axe-windows'

      - name: Emit conformance summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'evidence/axe-windows/summary.json') {
            $s = Get-Content 'evidence/axe-windows/summary.json' -Raw | ConvertFrom-Json
            @"
          ### Axe.Windows accessibility conformance — ${{ matrix.name }}

          - pinned Axe.Windows: `$($s.axe_windows_version)`
          - scanned top-level windows: `$($s.window_count)`
          - accessibility-rule errors: `$($s.error_count)`

          This is automated UI Automation accessibility-rule evidence. It complements, but does not replace, independent screenshot review, keyboard/event checks, or controlled interactive native-Windows acceptance.
          "@ >> $env:GITHUB_STEP_SUMMARY
          } else {
            "### Axe.Windows accessibility conformance — ${{ matrix.name }}`n`nNo conformance summary was produced; inspect the job log." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: axe-windows-conformance-${{ matrix.name }}
          path: evidence/axe-windows/
          if-no-files-found: warn
          retention-days: 14
