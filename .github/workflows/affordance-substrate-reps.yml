name: Affordance substrate qualification reps

on:
  pull_request:
    paths:
      - '.github/workflows/affordance-substrate-reps.yml'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affordance-substrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    name: Native Windows runtime evidence
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public projected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Record executor environment
        shell: pwsh
        run: |
          Write-Host '=== EXECUTOR ==='
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | Format-List
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "SESSIONNAME=$env:SESSIONNAME"

      - name: Build WinInspect and deterministic tests
        shell: pwsh
        run: |
          cmake -S source -B build -DWININSPECT_BUILD_TESTS=ON -DWININSPECT_USE_OPENSSL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Run projected deterministic tests on native Windows
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed.' }

      - name: Start actual WinInspect daemon on Windows
        shell: pwsh
        run: |
          $daemon = Resolve-Path 'build/Release/wininspectd.exe'
          $p = Start-Process -FilePath $daemon -ArgumentList '--headless' -PassThru -RedirectStandardOutput 'wininspectd.out.log' -RedirectStandardError 'wininspectd.err.log'
          "WININSPECTD_PID=$($p.Id)" >> $env:GITHUB_ENV
          $listener = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) {
              Get-Content wininspectd.out.log -ErrorAction SilentlyContinue
              Get-Content wininspectd.err.log -ErrorAction SilentlyContinue
              throw "wininspectd exited early: $($p.ExitCode)"
            }
            $listener = Get-NetTCPConnection -State Listen -LocalPort 1985 -OwningProcess $p.Id -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($listener) { break }
          }
          if (-not $listener) {
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object OwningProcess -eq $p.Id | Format-Table -AutoSize
            Get-Content wininspectd.out.log -ErrorAction SilentlyContinue
            Get-Content wininspectd.err.log -ErrorAction SilentlyContinue
            throw 'Could not discover WinInspect TCP listener from the daemon process.'
          }
          $target = $listener.LocalAddress
          if ($target -eq '0.0.0.0' -or $target -eq '::') { $target = '127.0.0.1' }
          Write-Host "Discovered daemon TCP target: $target`:1985"
          "WININSPECT_TARGET=$target" >> $env:GITHUB_ENV

      - name: Query actual Windows runtime capabilities
        shell: pwsh
        run: |
          $cli = Resolve-Path 'build/Release/wininspect.exe'
          $target = "$env:WININSPECT_TARGET`:1985"
          Write-Host '=== HEALTH ==='
          & $cli health --tcp $target
          if ($LASTEXITCODE -ne 0) { throw 'health failed' }
          Write-Host '=== IDENTITY ==='
          & $cli identity --tcp $target
          if ($LASTEXITCODE -ne 0) { throw 'identity failed' }
          Write-Host '=== CAPABILITIES ==='
          & $cli capabilities --tcp $target
          if ($LASTEXITCODE -ne 0) { throw 'capabilities failed' }

      - name: Probe read-only native sensors
        shell: pwsh
        continue-on-error: true
        run: |
          $cli = Resolve-Path 'build/Release/wininspect.exe'
          $target = "$env:WININSPECT_TARGET`:1985"
          Write-Host '=== WINDOWS ==='
          & $cli windows --tcp $target
          Write-Host '=== SCREENSHOT SENSOR ATTEMPT ==='
          & $cli screenshot --tcp $target --output affordance-screen.bmp

      - name: Collect daemon diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-Content wininspectd.out.log -ErrorAction SilentlyContinue
          Get-Content wininspectd.err.log -ErrorAction SilentlyContinue
          if ($env:WININSPECTD_PID) { Stop-Process -Id $env:WININSPECTD_PID -Force -ErrorAction SilentlyContinue }

  wine:
    name: Wine runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout public projected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Wine and MinGW
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 cmake wine64 xvfb
          wine --version
          x86_64-w64-mingw32-g++ --version | head -1

      - name: Cross-build actual WinInspect Windows binaries
        run: |
          # Experiment-only source portability repairs isolated by this lane.
          # They let runtime qualification continue while authoritative private source catches up.
          python3 - <<'PY'
          from pathlib import Path

          core = Path('source/core/src/core.cpp')
          s = core.read_text()
          if '#include <cstring>' not in s:
              s = s.replace('#include <cctype>\n', '#include <cctype>\n#include <cstring>\n', 1)
          s = s.replace('dispatch_["daemon.notify"] = [this]', 'dispatch_["daemon.notify"] = []')
          core.write_text(s)

          comp = Path('source/core/src/compress.cpp')
          s = comp.read_text()
          s = s.replace('Compress(compressor, data.data(), data.size()', 'Compress(compressor, const_cast<uint8_t*>(data.data()), data.size()')
          s = s.replace('Decompress(decompressor, data.data(), data.size()', 'Decompress(decompressor, const_cast<uint8_t*>(data.data()), data.size()')
          comp.write_text(s)

          net = Path('source/core/src/network_config.cpp')
          s = net.read_text()
          old = '''    char* appdata = nullptr;\n    size_t sz = 0;\n    if (_dupenv_s(&appdata, &sz, "APPDATA") == 0 && appdata) {\n      std::string dir = std::string(appdata) + "\\\\WinInspect";\n      free(appdata);\n      return dir;\n    }\n    return std::string(getenv("USERPROFILE")) + "\\\\.config\\\\wininspect";'''
          new = '''    const char* appdata = getenv("APPDATA");\n    if (appdata && appdata[0])\n      return std::string(appdata) + "\\\\WinInspect";\n    const char* profile = getenv("USERPROFILE");\n    if (profile && profile[0])\n      return std::string(profile) + "\\\\.config\\\\wininspect";\n    return ".\\\\.config\\\\wininspect";'''
          if old not in s:
              raise SystemExit('expected _dupenv_s block not found')
          net.write_text(s.replace(old, new, 1))

          cm = Path('source/CMakeLists.txt')
          s = cm.read_text()
          s = s.replace('advapi32 crypt32)', 'advapi32 crypt32 cabinet)', 1)
          # Resource compilation is not relevant to runtime affordance qualification and
          # currently has an MSVC-layout-specific icon path. Omit only in this cross-build rep.
          s = s.replace('    resources/wininspect.rc\n', '')
          cm.write_text(s)
          PY
          cmake -S source -B build-mingw \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DWININSPECT_BUILD_TESTS=OFF \
            -DWININSPECT_USE_OPENSSL=OFF
          cmake --build build-mingw -j2
          ls -l build-mingw/wininspectd.exe build-mingw/wininspect.exe

      - name: Initialize persistent Wine display and prefix
        env:
          WINEPREFIX: ${{ github.workspace }}/.wine-affordance
          WINEDEBUG: -all
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >xvfb.log 2>&1 &
          echo $! > xvfb.pid
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$WINEPREFIX" >> "$GITHUB_ENV"
          sleep 2
          wineboot --init
          echo '=== WINE EXECUTOR ==='
          wine --version
          uname -a

      - name: Start actual WinInspect daemon under Wine
        env:
          WINEDEBUG: -all
        run: |
          wine build-mingw/wininspectd.exe --headless >wine-daemon.log 2>&1 &
          echo $! > wine-daemon.pid
          sleep 8
          kill -0 "$(cat wine-daemon.pid)"
          TARGET=$(sed -n 's/.*TCP Server listening on \[\([^]]*\)\]:1985.*/\1/p' wine-daemon.log | tail -1)
          test -n "$TARGET"
          echo "WININSPECT_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Discovered daemon TCP target: $TARGET:1985"

      - name: Query actual Wine runtime capabilities
        env:
          WINEDEBUG: -all
        run: |
          TARGET="${WININSPECT_TARGET}:1985"
          echo '=== HEALTH ==='
          wine build-mingw/wininspect.exe health --tcp "$TARGET"
          echo '=== IDENTITY ==='
          wine build-mingw/wininspect.exe identity --tcp "$TARGET"
          echo '=== CAPABILITIES ==='
          wine build-mingw/wininspect.exe capabilities --tcp "$TARGET"

      - name: Probe read-only Wine sensors
        env:
          WINEDEBUG: -all
        continue-on-error: true
        run: |
          TARGET="${WININSPECT_TARGET}:1985"
          echo '=== WINDOWS ==='
          wine build-mingw/wininspect.exe windows --tcp "$TARGET"
          echo '=== SCREENSHOT SENSOR ATTEMPT ==='
          wine build-mingw/wininspect.exe screenshot --tcp "$TARGET" --output affordance-wine-screen.bmp

      - name: Collect Wine daemon diagnostics
        if: always()
        run: |
          cat wine-daemon.log 2>/dev/null || true
          cat xvfb.log 2>/dev/null || true
          if test -f wine-daemon.pid; then kill "$(cat wine-daemon.pid)" 2>/dev/null || true; fi
          if test -f xvfb.pid; then kill "$(cat xvfb.pid)" 2>/dev/null || true; fi

  evidence-boundary:
    name: Evidence boundary
    runs-on: ubuntu-latest
    needs: [native-windows, wine]
    if: always()
    steps:
      - name: State qualification boundary
        run: |
          echo 'These jobs execute actual WinInspect binaries on a GitHub-hosted Windows VM and under actual Wine on Linux.'
          echo 'Windows evidence is scoped to the hosted Windows runner environment; Wine evidence is scoped to the Wine/Xvfb environment.'
          echo 'Neither result is generalized to other Windows versions, sessions, Wine versions, targets, or mechanisms without bridging evidence.'
