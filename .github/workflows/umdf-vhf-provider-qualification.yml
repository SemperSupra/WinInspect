name: Phase 1 direct UMDF2 VHF provider qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/umdf-vhf-provider-qualification.yml'
      - 'experiments/umdf-vhf-minimal/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umdf-vhf-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  umdf-vhf-control:
    name: Minimal direct UMDF2 VHF control
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      WDS_SHA: 97429c5623590d52f001249460daf43e6749d777
      HARDWARE_ID: 'ROOT\WININSPECT\UMDFVHF'
    steps:
      - name: Check out public experiment plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare pinned WDK harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          [ordered]@{
            experiment = 'wininspect-382-direct-umdf2-vhf-control'
            commit = $env:GITHUB_SHA
            windows_caption = $os.Caption
            windows_version = $os.Version
            windows_build = $os.BuildNumber
            process_is_admin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            windows_driver_samples_sha = $env:WDS_SHA
            hardware_id = $env:HARDWARE_ID
          } | ConvertTo-Json -Depth 5 | Set-Content evidence/runner.json -Encoding utf8

          git clone --filter=blob:none --no-checkout https://github.com/microsoft/Windows-driver-samples.git wds
          if ($LASTEXITCODE -ne 0) { throw "clone failed: $LASTEXITCODE" }
          git -C wds checkout $env:WDS_SHA
          if ($LASTEXITCODE -ne 0) { throw "pinned checkout failed: $LASTEXITCODE" }
          nuget restore wds/packages.config -PackagesDirectory wds/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "WDK NuGet restore failed: $LASTEXITCODE" }

          New-Item -ItemType Directory -Force wds/hid/wininspect_umdf_vhf | Out-Null
          Copy-Item experiments/umdf-vhf-minimal/* wds/hid/wininspect_umdf_vhf/ -Force

          $vhfLibraries = @(Get-ChildItem wds/packages -Recurse -File -Filter VhfUm.lib -ErrorAction SilentlyContinue)
          $vhfLibraries |
            Select-Object FullName,Length |
            ConvertTo-Json -Depth 4 |
            Set-Content evidence/vhfum-inventory.json -Encoding utf8

          $vhfUm = $vhfLibraries |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $vhfUm) { throw 'Pinned WDK restored but x64 VhfUm.lib was not found' }

          $vhfUm.FullName | Set-Content evidence/vhfum-selected.txt -Encoding utf8

          $wdfHeaders = @(Get-ChildItem wds/packages -Recurse -File -Filter wdf.h -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]umdf[\\/]' } |
            Sort-Object FullName)
          $wdfHeaders |
            Select-Object FullName,Length |
            ConvertTo-Json -Depth 4 |
            Set-Content evidence/wdf-header-inventory.json -Encoding utf8

          $wdfHeader = $wdfHeaders | Select-Object -Last 1
          if (-not $wdfHeader) { throw 'Pinned WDK restored but UMDF wdf.h was not found' }
          $wdfHeader.FullName | Set-Content evidence/wdf-header-selected.txt -Encoding utf8
          $wdfVersion = $wdfHeader.Directory.Name

          $wdfStubs = @(Get-ChildItem wds/packages -Recurse -File -Filter WdfDriverStubUm.lib -ErrorAction SilentlyContinue)
          $wdfStubs |
            Select-Object FullName,Length |
            ConvertTo-Json -Depth 4 |
            Set-Content evidence/wdf-stub-inventory.json -Encoding utf8
          $versionPattern = [regex]::Escape($wdfVersion)
          $wdfStub = $wdfStubs |
            Where-Object { $_.FullName -match "[\\/]umdf[\\/]x64[\\/]$versionPattern[\\/]" } |
            Select-Object -First 1
          if (-not $wdfStub) { throw "Version-matched WdfDriverStubUm.lib not found for UMDF $wdfVersion" }
          $wdfStub.FullName | Set-Content evidence/wdf-stub-selected.txt -Encoding utf8

          $props = @(
            '<Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">'
            '  <Import Project="$(MSBuildThisFileDirectory)..\..\Directory.Build.props" />'
            '  <ItemDefinitionGroup>'
            '    <ClCompile>'
            "      <AdditionalIncludeDirectories>$($wdfHeader.Directory.FullName);%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>"
            '    </ClCompile>'
            '    <Link>'
            "      <AdditionalLibraryDirectories>$($vhfUm.Directory.FullName);$($wdfStub.Directory.FullName);%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>"
            '    </Link>'
            '  </ItemDefinitionGroup>'
            '</Project>'
          )
          $props | Set-Content wds/hid/wininspect_umdf_vhf/Directory.Build.props -Encoding utf8

      - name: Build direct UMDF2 VHF fixture
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          $buildCode = 1
          $solution = 'wds\hid\wininspect_umdf_vhf\WinInspectUmdfVhf.sln'
          try {
            $msbuildArgs = @(
              $solution,
              '/m:1',
              '/t:Rebuild',
              '/p:Configuration=Release',
              '/p:Platform=x64',
              '/p:TargetVersion=Windows10',
              '/p:UMDF_VERSION_MAJOR=2',
              '/p:UMDF_VERSION_MINOR=35',
              '/p:UMDF_MINIMUM_VERSION_REQUIRED=35',
              '/warnaserror',
              '/v:minimal',
              '/bl:evidence\wininspect-umdf235.binlog',
              '/flp1:errorsonly;logfile=evidence\wininspect-umdf235.err',
              '/flp2:warningsonly;logfile=evidence\wininspect-umdf235.wrn'
            )
            & msbuild.exe @msbuildArgs *> evidence\wininspect-umdf235.out
            $buildCode = $LASTEXITCODE
          }
          catch {
            $_ | Out-String | Set-Content evidence/build-exception.txt
            $buildCode = 1
          }

          [ordered]@{
            method = 'direct-msbuild-forced-umdf235'
            umdf_major = 2
            umdf_minor = 35
            umdf_minimum = 35
            exit_code = $buildCode
          } | ConvertTo-Json | Set-Content evidence/build-invocation.json -Encoding utf8
          $artifacts = @(Get-ChildItem wds/hid/wininspect_umdf_vhf -Recurse -File -Include *.dll,*.inf,*.cat |
            Select-Object FullName,Length,@{n='SHA256';e={(Get-FileHash $_.FullName -Algorithm SHA256).Hash}})
          $artifacts | ConvertTo-Json -Depth 4 | Set-Content evidence/build-artifacts.json -Encoding utf8

          $dll = $artifacts | Where-Object { $_.FullName -match 'WinInspectUmdfVhf\.dll$' } | Select-Object -First 1
          $inf = $artifacts | Where-Object { $_.FullName -match 'WinInspectUmdfVhf\.inf$' } | Select-Object -First 1
          $cat = $artifacts | Where-Object { $_.FullName -match 'wudf\.cat$' } | Select-Object -First 1

          $packageReady = [bool]($inf -and $cat)
          "package_ready=$($packageReady.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          [ordered]@{
            exit_code = $buildCode
            dll_present = [bool]$dll
            wdk_inf_present = [bool]$inf
            wdk_catalog_present = [bool]$cat
            package_ready = $packageReady
            dll_sha256 = if ($dll) { $dll.SHA256 } else { $null }
            inf_sha256 = if ($inf) { $inf.SHA256 } else { $null }
            catalog_sha256 = if ($cat) { $cat.SHA256 } else { $null }
          } | ConvertTo-Json | Set-Content evidence/build-result.json -Encoding utf8

          if ($buildCode -ne 0 -or -not $dll) { exit 1 }

      - name: Differential control - official Microsoft UMDF package
        if: steps.build.outcome == 'success' && steps.build.outputs.package_ready != 'true'
        id: package_control
        shell: pwsh
        continue-on-error: true
        run: |
          $controlCode = 1
          $controlDir = 'wds/hid/vhidmini2/driver/umdf2'
          $controlSln = @(
            'Microsoft Visual Studio Solution File, Format Version 12.00'
            '# Visual Studio Version 17'
            'VisualStudioVersion = 17.0.31903.59'
            'MinimumVisualStudioVersion = 10.0.40219.1'
            'Project("{8BC9CEB8-8B4A-11D0-8D11-00A0C91BC942}") = "VhidminiUm", "VhidminiUm.vcxproj", "{EEECA421-064D-4E2E-8832-B0F43A9B394C}"'
            'EndProject'
            'Global'
            '    GlobalSection(SolutionConfigurationPlatforms) = preSolution'
            '        Release|x64 = Release|x64'
            '    EndGlobalSection'
            '    GlobalSection(ProjectConfigurationPlatforms) = postSolution'
            '        {EEECA421-064D-4E2E-8832-B0F43A9B394C}.Release|x64.ActiveCfg = Release|x64'
            '        {EEECA421-064D-4E2E-8832-B0F43A9B394C}.Release|x64.Build.0 = Release|x64'
            '    EndGlobalSection'
            'EndGlobal'
          )
          $controlSln | Set-Content (Join-Path $controlDir 'VhidminiUm.sln') -Encoding ascii

          Push-Location wds
          try {
            ./Build-Samples.ps1 -Samples 'hid.vhidmini2.driver.umdf2' -Configurations 'Release' -Platforms 'x64' -RunMode NuGet -ThrottleLimit 1 -Verbose
            $controlCode = if ($LASTEXITCODE) { $LASTEXITCODE } else { 0 }
          }
          catch {
            $_ | Out-String | Set-Content ../evidence/package-control-exception.txt
            $controlCode = 1
          }
          finally { Pop-Location }

          $controlRoot = 'wds/hid/vhidmini2/driver/umdf2'
          $controlArtifacts = @(Get-ChildItem $controlRoot -Recurse -File -Include *.dll,*.inf,*.cat,*.inx -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,@{n='SHA256';e={(Get-FileHash $_.FullName -Algorithm SHA256).Hash}})
          $controlArtifacts | ConvertTo-Json -Depth 4 | Set-Content evidence/package-control-artifacts.json -Encoding utf8

          $controlDll = $controlArtifacts | Where-Object { $_.FullName -match 'VhidminiUm\.dll$' } | Select-Object -First 1
          $controlInf = $controlArtifacts | Where-Object { $_.FullName -match 'VhidminiUm\.inf$' } | Select-Object -First 1
          $controlCat = $controlArtifacts | Where-Object { $_.FullName -match '\.cat$' } | Select-Object -First 1
          $controlInx = $controlArtifacts | Where-Object { $_.FullName -match 'VhidminiUm\.inx$' } | Select-Object -First 1

          [ordered]@{
            exit_code = $controlCode
            dll_present = [bool]$controlDll
            inx_present = [bool]$controlInx
            inf_present = [bool]$controlInf
            catalog_present = [bool]$controlCat
            interpretation = if ($controlInf -and $controlCat) {
              'official-sample-packages; WinInspect project metadata differs'
            } elseif ($controlDll -and $controlInx -and -not $controlInf -and -not $controlCat) {
              'NuGet sample mode builds UMDF but does not emit stamped package in-tree'
            } else {
              'control inconclusive'
            }
          } | ConvertTo-Json | Set-Content evidence/package-control-result.json -Encoding utf8

          if ($controlCode -ne 0) { exit 1 }

      - name: Sign, install, and observe VHF child
        if: steps.build.outcome == 'success' && steps.build.outputs.package_ready == 'true'
        id: runtime
        shell: pwsh
        continue-on-error: true
        run: |
          $result = [ordered]@{
            classification = 'not-attempted'
            published_name = $null
            source_instance_id = $null
            child_ids = @()
          }

          $inf = Get-ChildItem wds/hid/wininspect_umdf_vhf -Recurse -File -Filter 'WinInspectUmdfVhf.inf' | Select-Object -First 1
          if (-not $inf) { throw 'WDK-generated INF not found' }
          $cat = Get-ChildItem $inf.Directory.FullName -File -Filter 'wudf.cat' | Select-Object -First 1
          if (-not $cat) { throw 'WDK-generated catalog not found' }

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=WinInspect Direct UMDF VHF CI' -CertStoreLocation 'Cert:\LocalMachine\My' -HashAlgorithm SHA256 -KeyLength 2048 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(2)
          Export-Certificate -Cert $cert -FilePath evidence/umdf-test.cer -Force | Out-Null
          Import-Certificate -FilePath evidence/umdf-test.cer -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          Import-Certificate -FilePath evidence/umdf-test.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null

          $signtool = Get-ChildItem wds/packages -Recurse -File -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\signtool.exe' } |
            Sort-Object FullName -Descending | Select-Object -ExpandProperty FullName -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }

          & $signtool sign /fd SHA256 /s My /sm /sha1 $cert.Thumbprint $cat.FullName | Set-Content evidence/sign-cat.txt
          if ($LASTEXITCODE -ne 0) { throw 'catalog signing failed' }
          & $signtool verify /pa /v $cat.FullName | Set-Content evidence/verify-cat.txt
          if ($LASTEXITCODE -ne 0) { throw 'catalog verification failed' }

          $stage = & pnputil.exe /add-driver $inf.FullName 2>&1
          $stageCode = $LASTEXITCODE
          $stage | Set-Content evidence/stage.txt
          $published = [regex]::Match(($stage -join [Environment]::NewLine), '(?im)^Published Name\s*:\s*(oem\d+\.inf)\s*$')
          if ($published.Success) { $result.published_name = $published.Groups[1].Value }
          if ($stageCode -ne 0) {
            $result.classification = 'signed-umdf-package-stage-failed'
            $result | ConvertTo-Json -Depth 8 | Set-Content evidence/runtime-result.json
            exit 1
          }

          $devcon = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10' -Recurse -File -Filter devcon.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*\x64\devcon.exe' } |
            Sort-Object FullName -Descending | Select-Object -ExpandProperty FullName -First 1
          if (-not $devcon) {
            $result.classification = 'hosted-runner-devcon-unavailable'
            $result | ConvertTo-Json -Depth 8 | Set-Content evidence/runtime-result.json
            exit 1
          }

          $install = & $devcon install $inf.FullName $env:HARDWARE_ID 2>&1
          $installCode = $LASTEXITCODE
          $install | Set-Content evidence/devcon-install.txt
          Start-Sleep -Seconds 3

          $source = @(Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue | Where-Object {
            $ids = @((Get-PnpDeviceProperty -InstanceId $_.InstanceId -KeyName 'DEVPKEY_Device_HardwareIds' -ErrorAction SilentlyContinue).Data)
            ($ids -join ';') -match 'ROOT\\WININSPECT\\UMDFVHF'
          })
          $result.source_instance_id = if ($source) { $source[0].InstanceId } else { $null }
          if ($result.source_instance_id) {
            $result.child_ids = @((Get-PnpDeviceProperty -InstanceId $result.source_instance_id -KeyName 'DEVPKEY_Device_Children' -ErrorAction SilentlyContinue).Data)
          }

          $source | Select-Object Status,Class,FriendlyName,InstanceId,Problem | ConvertTo-Json -Depth 5 | Set-Content evidence/source.json -Encoding utf8
          $result.child_ids | ConvertTo-Json -Depth 4 | Set-Content evidence/child-ids.json -Encoding utf8

          $childRecords = @()
          foreach ($child in @($result.child_ids)) {
            $dev = Get-PnpDevice -InstanceId $child -ErrorAction SilentlyContinue
            if ($dev) {
              $childRecords += [pscustomobject]@{Status=$dev.Status;Class=$dev.Class;FriendlyName=$dev.FriendlyName;InstanceId=$dev.InstanceId;Problem=$dev.Problem}
            }
          }
          $childRecords | ConvertTo-Json -Depth 5 | Set-Content evidence/children.json -Encoding utf8

          $sourceOk = [bool]($source | Where-Object Status -eq 'OK')
          $childOk = [bool]($childRecords | Where-Object { $_.Status -eq 'OK' -and $_.Class -eq 'HIDClass' })

          if ($sourceOk -and $childOk) {
            $result.classification = 'direct-umdf2-vhf-source-and-hid-child-started'
          } elseif ($sourceOk) {
            $result.classification = 'direct-umdf2-source-started-vhf-child-not-observed'
          } elseif ($installCode -ne 0) {
            $result.classification = 'direct-umdf2-devcon-install-failed'
          } else {
            $result.classification = 'direct-umdf2-source-not-ok'
          }

          $result | ConvertTo-Json -Depth 8 | Set-Content evidence/runtime-result.json -Encoding utf8
          Get-Content evidence/runtime-result.json
          if ($result.classification -ne 'direct-umdf2-vhf-source-and-hid-child-started') { exit 1 }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if (Test-Path evidence/runtime-result.json) {
            $r = Get-Content evidence/runtime-result.json | ConvertFrom-Json
            if ($r.source_instance_id) { pnputil.exe /remove-device $r.source_instance_id | Out-File evidence/cleanup-device.txt }
            if ($r.published_name) { pnputil.exe /delete-driver $r.published_name /uninstall /force | Out-File evidence/cleanup-driver.txt }
          }
          Get-ChildItem Cert:\LocalMachine\Root | Where-Object Subject -eq 'CN=WinInspect Direct UMDF VHF CI' | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\LocalMachine\TrustedPublisher | Where-Object Subject -eq 'CN=WinInspect Direct UMDF VHF CI' | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\LocalMachine\My | Where-Object Subject -eq 'CN=WinInspect Direct UMDF VHF CI' | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase1-direct-umdf-vhf-control
          path: evidence/
          if-no-files-found: error
          retention-days: 14
