name: Public WineHQ11 synthetic WinEvent delivery admission
on:
  pull_request:
    paths: ['.github/workflows/public-wine11-winevent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-wine11-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-fixture:
    name: Compile public x64 synthetic WinEvent fixture
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Compile Windows-only synthetic producer
        shell: pwsh
        run: |
          cmake -S experiments/native-observer -B build/fixture -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic configure failed' }
          cmake --build build/fixture --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic build failed' }
          if (!(Test-Path build/fixture/Release/native-winevent-probe.exe)) { throw 'Synthetic executable missing' }
          Get-FileHash build/fixture/Release/native-winevent-probe.exe -Algorithm SHA256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-wine11-synthetic-pe
          path: build/fixture/Release/native-winevent-probe.exe
          if-no-files-found: error
          retention-days: 1
  wine11:
    name: Qualify native WoW64 WineHQ11 on disposable Ubuntu 26.04
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    needs: native-fixture
    timeout-minutes: 22
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-wine11-synthetic-pe
          path: fixture
      - name: Admit official WineHQ 11 on 26.04 without i386 fallback
        shell: bash
        run: |
          set -euo pipefail
          test -s fixture/native-winevent-probe.exe
          sha256sum fixture/native-winevent-probe.exe
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl gnupg xvfb xauth
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.winehq.org/wine-builds/winehq.key | gpg --batch --yes --dearmor -o /etc/apt/keyrings/winehq-archive.key
          curl -fsSL https://dl.winehq.org/wine-builds/ubuntu/dists/resolute/winehq-resolute.sources | tee /etc/apt/sources.list.d/winehq-resolute.sources >/dev/null
          apt-get update -qq
          apt-cache policy wine-stable
          apt-cache show wine-stable=11.0.0.0~resolute-1 | grep -E '^(Package|Version|Depends|Recommends):' || true
          # Fail only on a HARD i386 dependency. Optional Recommends and
          # conflicts are not installed by --no-install-recommends.
          if apt-cache show wine-stable=11.0.0.0~resolute-1 | grep -E '^Depends:.*wine-stable-i386'; then
            echo 'Unexpected mandatory i386 dependency in WineHQ11 Resolute package' >&2
            exit 1
          fi
          test -z "$(dpkg --print-foreign-architectures)"
          apt-get install -y --no-install-recommends winehq-stable
          wine --version | tee wine11-version.txt
          grep -Eq '^wine-11\.' wine11-version.txt
          echo 'WINEHQ11_2604_VERSION=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Isolated prefix init and independent WinEvent delivery
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's bind-mounted RUNNER_TEMP is not owned by the
          # container's process user; Wine rightly refuses a foreign prefix.
          # Run the synthetic PE and Xvfb as a dedicated unprivileged user.
          useradd -m -s /bin/bash wineprobe
          install -d -o wineprobe -g wineprobe -m 0700 /home/wineprobe/prefix
          runuser -u wineprobe -- test -r "$GITHUB_WORKSPACE/fixture/native-winevent-probe.exe"
          runuser -u wineprobe -- env WINEPREFIX=/home/wineprobe/prefix WINEARCH=wow64 WINEDEBUG=fixme-all GITHUB_WORKSPACE="$GITHUB_WORKSPACE" timeout 250s xvfb-run -a bash -c '
            set -euo pipefail
            echo WINEHQ11_PREFIX_BOOT=START
            # Fresh prefix: test explicit initial creation, not update (-u).
            # Stop quickly and retain bounded diagnostics instead of another
            # 160-second blind startup hang.
            if timeout 50s wineboot --init > prefix-boot.txt 2>&1; then
              echo WINEHQ11_PREFIX_BOOT=PASS
            else
              status=$?
              echo "WINEHQ11_PREFIX_BOOT=FAIL code=$status"
              echo WINEHQ11_PROCESS_CENSUS=BEGIN
              ps -eo pid,ppid,user,stat,etime,comm | grep -E "PID|wine|rpcss|service|device|explorer" | head -n 35 || true
              echo WINEHQ11_PROCESS_CENSUS=END
              echo WINEHQ11_PREFIX_STRUCTURE=BEGIN
              find "$WINEPREFIX" -maxdepth 2 -type f -printf "%P\n" | head -n 35 || true
              echo WINEHQ11_PREFIX_STRUCTURE=END
              echo WINEHQ11_BOOT_LOG=BEGIN
              tail -n 50 prefix-boot.txt || true
              echo WINEHQ11_BOOT_LOG=END
              exit "$status"
            fi
            echo WINEHQ11_SYNTHETIC_PROBE=START
            if timeout 60s wine "$GITHUB_WORKSPACE/fixture/native-winevent-probe.exe" --probe > synthetic-receipt.txt 2>&1; then
              cat synthetic-receipt.txt
            else
              status=$?
              echo "WINEHQ11_SYNTHETIC_PROBE=FAIL code=$status"
              tail -n 35 synthetic-receipt.txt || true
              exit "$status"
            fi
            grep -qx "RESULT=SYNTHETIC_DELIVERY_OBSERVED" synthetic-receipt.txt
            grep -Eq "^CREATE_OBSERVED=[1-9][0-9]*$" synthetic-receipt.txt
            grep -Eq "^SHOW_OBSERVED=[1-9][0-9]*$" synthetic-receipt.txt
            echo WINEHQ11_SYNTHETIC_DELIVERY=PASS
            wineserver -k >/dev/null 2>&1 || true
          '
          echo 'PUBLIC_WINEHQ11_NATIVE_WOW64_WINEVENT=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Evidence boundary
        if: always()
        run: echo 'Public synthetic WineHQ11 probe only; no private WinInspect daemon, real user target, consumer HIL, release, or private Actions minutes.' >> "$GITHUB_STEP_SUMMARY"
