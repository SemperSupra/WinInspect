name: Public WineHQ11 synthetic WinEvent delivery admission
on:
  pull_request:
    paths: ['.github/workflows/public-wine11-winevent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-wine11-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-fixture:
    name: Compile 64-bit synthetic EXE on free public Windows
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Build exact synthetic window producer with static MSVC runtime
        shell: pwsh
        run: |
          cmake -S experiments/native-observer -B build/fixture -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic configure failed' }
          cmake --build build/fixture --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic build failed' }
          if (!(Test-Path build/fixture/Release/native-winevent-probe.exe)) { throw 'Synthetic PE missing' }
          Get-FileHash build/fixture/Release/native-winevent-probe.exe -Algorithm SHA256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-wine11-synthetic-pe
          path: build/fixture/Release/native-winevent-probe.exe
          if-no-files-found: error
          retention-days: 1
  wine11:
    name: Run independent public x64 fixture on signed WineHQ11
    runs-on: ubuntu-24.04
    needs: native-fixture
    timeout-minutes: 16
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-wine11-synthetic-pe
          path: fixture
      - name: Verify artifact and install only 64-bit WineHQ11 runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s fixture/native-winevent-probe.exe
          sha256sum fixture/native-winevent-probe.exe
          # No i386 architecture, no cross-compiler toolchain on this Linux runner.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.winehq.org/wine-builds/winehq.key | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/winehq-archive.key
          curl -fsSL https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources | sudo tee /etc/apt/sources.list.d/winehq-noble.sources >/dev/null
          sudo apt-get update -qq
          # The Noble winehq-stable metapackage hard-requires wine-stable-i386.
          # The synthetic Win32 test is x64: install WineHQ's amd64 runtime only.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wine-stable-amd64 xvfb xauth
          # WineHQ packages split runtime libraries (wine-stable-amd64) from
          # launchers (wine-stable). The launcher .deb has an i386 dependency
          # only at package-manager level; extract its signed-repo payload
          # without installing/configuring that multiarch metapackage.
          apt-get download wine-stable
          launcher_deb="$(find . -maxdepth 1 -name 'wine-stable_11.*_amd64.deb' -print -quit)"
          test -n "$launcher_deb"
          runtime_version="$(dpkg-query -W -f='${Version}' wine-stable-amd64)"
          launcher_version="$(dpkg-deb -f "$launcher_deb" Version)"
          test "$runtime_version" = "$launcher_version"
          case "$runtime_version" in 11.*) ;; *) echo 'WineHQ package-version mismatch' >&2; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/winehq-launcher"
          dpkg-deb -x "$launcher_deb" "$RUNNER_TEMP/winehq-launcher"
          test -x "$RUNNER_TEMP/winehq-launcher/opt/wine-stable/bin/wine"
          test -x "$RUNNER_TEMP/winehq-launcher/opt/wine-stable/bin/wineserver"
          sudo install -m 0755 "$RUNNER_TEMP/winehq-launcher/opt/wine-stable/bin/wine" /opt/wine-stable/bin/wine
          sudo install -m 0755 "$RUNNER_TEMP/winehq-launcher/opt/wine-stable/bin/wineserver" /opt/wine-stable/bin/wineserver
          loader=/opt/wine-stable/bin/wine
          "$loader" --version | tee wine11-version.txt
          grep -Eq '^wine-11\.' wine11-version.txt
          echo "WINEHQ_LOADER=$loader" >> "$GITHUB_ENV"
      - name: Require cross-process synthetic WinEvent create and show callbacks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/wine-stable/bin:$PATH"
          export WINEDEBUG=-all
          export WINEPREFIX="$RUNNER_TEMP/public-wine11"
          timeout 150s xvfb-run -a bash -c '
            set -euo pipefail
            "$WINEHQ_LOADER" "$GITHUB_WORKSPACE/fixture/native-winevent-probe.exe" --probe | tee wine11-receipt.txt
            grep -qx "RESULT=SYNTHETIC_DELIVERY_OBSERVED" wine11-receipt.txt
            grep -Eq "^CREATE_OBSERVED=[1-9][0-9]*$" wine11-receipt.txt
            grep -Eq "^SHOW_OBSERVED=[1-9][0-9]*$" wine11-receipt.txt
            if test -x /opt/wine-stable/bin/wineserver; then
              /opt/wine-stable/bin/wineserver -k >/dev/null 2>&1 || true
            fi
          '
          echo 'PUBLIC_WINE11_SYNTHETIC_WINEVENT=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: State bounded qualification
        if: always()
        shell: bash
        run: |
          echo 'Public synthetic 64-bit WineHQ11 qualification only, not private daemon RPC or WineBot acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No private minutes, secrets, user targets, or product-source publication.' >> "$GITHUB_STEP_SUMMARY"
