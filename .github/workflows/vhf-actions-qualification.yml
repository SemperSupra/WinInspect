name: Public VHF Actions qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vhf-actions-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vhf-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vhf-preflight:
    name: VHF build/sign/stage hosted-runner feasibility
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    env:
      WDS_SHA: 97429c5623590d52f001249460daf43e6749d777
    steps:
      - name: Check out public deploy plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record hosted Windows boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $computer = Get-CimInstance Win32_ComputerSystem
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          $admin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $secureBoot = $null
          try { $secureBoot = Confirm-SecureBootUEFI } catch { $secureBoot = "unavailable:$($_.Exception.Message)" }
          [ordered]@{
            experiment = 'wininspect-381-vhf-actions-sign-stage'
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            windows_caption = $os.Caption
            windows_version = $os.Version
            windows_build = $os.BuildNumber
            manufacturer = $computer.Manufacturer
            model = $computer.Model
            process_is_admin = $admin
            secure_boot = $secureBoot
            windows_driver_samples_sha = $env:WDS_SHA
          } | ConvertTo-Json -Depth 5 | Set-Content evidence/runner.json -Encoding utf8
          Get-Content evidence/runner.json

      - name: Acquire pinned Microsoft driver samples
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/Windows-driver-samples.git wds
          if ($LASTEXITCODE -ne 0) { throw "clone failed: $LASTEXITCODE" }
          git -C wds checkout $env:WDS_SHA
          if ($LASTEXITCODE -ne 0) { throw "pinned checkout failed: $LASTEXITCODE" }
          git -C wds rev-parse HEAD | Tee-Object -FilePath evidence/wds-head.txt
          if (-not (Test-Path wds/packages.config)) { throw 'packages.config missing after pinned checkout' }

      - name: Restore Microsoft WDK NuGet packages
        shell: pwsh
        run: |
          nuget restore wds/packages.config -PackagesDirectory wds/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "WDK NuGet restore failed: $LASTEXITCODE" }
          Get-ChildItem wds/packages -Directory | Select-Object -ExpandProperty Name | Sort-Object | Set-Content evidence/wdk-packages.txt

      - name: Build Microsoft vhidmini2 control fixture
        shell: pwsh
        run: |
          Push-Location wds
          try {
            ./Build-Samples.ps1 `
              -Samples 'hid.vhidmini2' `
              -Configurations 'Release' `
              -Platforms 'x64' `
              -RunMode NuGet `
              -ThrottleLimit 1 `
              -Verbose
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Build-Samples failed: $LASTEXITCODE" }
          }
          finally { Pop-Location }
          Copy-Item wds/_logs -Destination evidence/wds-build-logs -Recurse -Force -ErrorAction SilentlyContinue
          $artifacts = Get-ChildItem wds/hid/vhidmini2 -Recurse -File -Include *.dll,*.sys,*.inf,*.cat,*.exe |
            Select-Object FullName,Length,@{n='SHA256';e={(Get-FileHash $_.FullName -Algorithm SHA256).Hash}}
          $artifacts | ConvertTo-Json -Depth 4 | Set-Content evidence/build-artifacts.json -Encoding utf8
          if (-not ($artifacts | Where-Object { $_.FullName -match 'VhidminiUm\.inf$' })) { throw 'UMDF2 fixture INF was not produced.' }

      - name: Test-sign, trust, and stage UMDF2 package
        id: stage
        shell: pwsh
        continue-on-error: true
        run: |
          $result = [ordered]@{
            attempted = $false
            inf = $null
            catalog = $null
            certificate_thumbprint = $null
            signature_status = $null
            pnputil_exit_code = $null
            published_name = $null
            cleanup_exit_code = $null
            classification = 'fixture-not-found'
            output = @()
            cleanup_output = @()
          }

          $inf = Get-ChildItem wds/hid/vhidmini2/driver/umdf2 -Recurse -File -Filter 'VhidminiUm.inf' |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName 'wudf.cat') } |
            Select-Object -First 1
          if (-not $inf) {
            $result | ConvertTo-Json -Depth 8 | Set-Content evidence/sign-stage.json -Encoding utf8
            throw 'Packaged UMDF2 INF/catalog pair was not found.'
          }

          $cat = Join-Path $inf.Directory.FullName 'wudf.cat'
          $result.attempted = $true
          $result.inf = $inf.FullName
          $result.catalog = $cat

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=WinInspect CI Test Driver Signing' `
            -CertStoreLocation 'Cert:\LocalMachine\My' `
            -HashAlgorithm SHA256 `
            -KeyLength 2048 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddDays(1)
          $result.certificate_thumbprint = $cert.Thumbprint
          Export-Certificate -Cert $cert -FilePath evidence/wininspect-ci-test-driver.cer -Force | Out-Null
          Import-Certificate -FilePath evidence/wininspect-ci-test-driver.cer -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          Import-Certificate -FilePath evidence/wininspect-ci-test-driver.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null

          $signtool = Get-ChildItem wds/packages -Recurse -File -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -ExpandProperty FullName -First 1
          if (-not $signtool) { throw 'signtool.exe not found in restored SDK/WDK packages.' }
          $signtool | Set-Content evidence/signtool-path.txt

          & $signtool sign /v /fd SHA256 /s My /sm /sha1 $cert.Thumbprint $cat 2>&1 | Tee-Object -FilePath evidence/signtool-sign.txt
          if ($LASTEXITCODE -ne 0) {
            $result.classification = 'test-sign-failed'
            $result | ConvertTo-Json -Depth 8 | Set-Content evidence/sign-stage.json -Encoding utf8
            throw "signtool sign failed: $LASTEXITCODE"
          }
          & $signtool verify /v /pa $cat 2>&1 | Tee-Object -FilePath evidence/signtool-verify.txt
          $signature = Get-AuthenticodeSignature -FilePath $cat
          $result.signature_status = [string]$signature.Status

          $lines = & pnputil.exe /add-driver $inf.FullName 2>&1
          $code = $LASTEXITCODE
          $result.pnputil_exit_code = $code
          $result.output = @($lines | ForEach-Object { "$_" })
          $joined = $result.output -join "`n"
          $published = [regex]::Match($joined, '(?im)^Published Name\s*:\s*(oem\d+\.inf)\s*$')
          if ($published.Success) { $result.published_name = $published.Groups[1].Value }

          if ($code -eq 0) {
            $result.classification = 'hosted-runner-signed-package-staged'
          }
          elseif ($joined -match 'signature|signed|publisher|hash|certificate') {
            $result.classification = 'hosted-runner-signing-boundary-persists'
          }
          elseif ($joined -match 'access|denied|privilege|administrator') {
            $result.classification = 'hosted-runner-privilege-boundary'
          }
          else {
            $result.classification = 'hosted-runner-stage-unsupported-or-other'
          }

          if ($result.published_name) {
            $cleanup = & pnputil.exe /delete-driver $result.published_name /uninstall /force 2>&1
            $result.cleanup_exit_code = $LASTEXITCODE
            $result.cleanup_output = @($cleanup | ForEach-Object { "$_" })
          }

          $result | ConvertTo-Json -Depth 8 | Set-Content evidence/sign-stage.json -Encoding utf8
          Get-Content evidence/sign-stage.json
          if ($code -ne 0) { exit 1 }

      - name: Summarize disposition
        if: always()
        shell: pwsh
        run: |
          $stage = if (Test-Path evidence/sign-stage.json) { Get-Content evidence/sign-stage.json | ConvertFrom-Json } else { $null }
          [ordered]@{
            experiment = 'wininspect-381-vhf-actions-sign-stage'
            discovery_only = $true
            fixture = 'Microsoft vhidmini2 UMDF2 control fixture; not VHF runtime evidence'
            signing_stage = if ($stage) { $stage.classification } else { 'not-attempted' }
            next = if ($stage -and $stage.classification -eq 'hosted-runner-signed-package-staged') {
              'Run the next causal cell: actual VHF fixture plus source-device creation/start. Do not infer VHF runtime success from this control.'
            } else {
              'Stop hosted Windows at the recorded boundary unless one causal variable is changed.'
            }
          } | ConvertTo-Json -Depth 5 | Set-Content evidence/summary.json -Encoding utf8
          Get-Content evidence/summary.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vhf-actions-sign-stage
          path: evidence/
          if-no-files-found: error
          retention-days: 14
