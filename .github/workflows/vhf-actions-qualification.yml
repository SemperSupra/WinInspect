name: Public VHF Actions qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vhf-actions-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vhf-preflight:
    name: VHF build and hosted-runner feasibility
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    env:
      WDS_SHA: 97429c5623590d52f001249460daf43e6749d777
    steps:
      - name: Check out public deploy plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record hosted Windows boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $computer = Get-CimInstance Win32_ComputerSystem
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          $admin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $secureBoot = $null
          try { $secureBoot = Confirm-SecureBootUEFI } catch { $secureBoot = "unavailable:$($_.Exception.Message)" }
          [ordered]@{
            experiment = 'wininspect-381-vhf-actions-preflight'
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            windows_caption = $os.Caption
            windows_version = $os.Version
            windows_build = $os.BuildNumber
            manufacturer = $computer.Manufacturer
            model = $computer.Model
            process_is_admin = $admin
            secure_boot = $secureBoot
            windows_driver_samples_sha = $env:WDS_SHA
          } | ConvertTo-Json -Depth 5 | Set-Content evidence/runner.json -Encoding utf8
          Get-Content evidence/runner.json

      - name: Acquire pinned Microsoft driver samples
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/Windows-driver-samples.git wds
          if ($LASTEXITCODE -ne 0) { throw "clone failed: $LASTEXITCODE" }
          git -C wds checkout $env:WDS_SHA
          if ($LASTEXITCODE -ne 0) { throw "pinned checkout failed: $LASTEXITCODE" }
          git -C wds rev-parse HEAD | Tee-Object -FilePath evidence/wds-head.txt
          if (-not (Test-Path wds/packages.config)) { throw 'packages.config missing after pinned checkout' }

      - name: Restore Microsoft WDK NuGet packages
        shell: pwsh
        run: |
          nuget help | Select-Object -First 3 | Set-Content evidence/nuget-version.txt
          nuget restore wds/packages.config -PackagesDirectory wds/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "WDK NuGet restore failed: $LASTEXITCODE" }
          Get-ChildItem wds/packages -Directory | Select-Object -ExpandProperty Name | Sort-Object | Set-Content evidence/wdk-packages.txt
          Get-Content evidence/wdk-packages.txt

      - name: Build Microsoft vhidmini2 through official harness
        shell: pwsh
        run: |
          Push-Location wds
          try {
            ./Build-Samples.ps1 `
              -Samples 'hid.vhidmini2' `
              -Configurations 'Release' `
              -Platforms 'x64' `
              -RunMode NuGet `
              -ThrottleLimit 1 `
              -Verbose
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Build-Samples failed: $LASTEXITCODE" }
          }
          finally { Pop-Location }
          Copy-Item wds/_logs -Destination evidence/wds-build-logs -Recurse -Force -ErrorAction SilentlyContinue
          $artifacts = Get-ChildItem wds/hid/vhidmini2 -Recurse -File -Include *.sys,*.inf,*.cat,*.exe |
            Select-Object FullName,Length,@{n='SHA256';e={(Get-FileHash $_.FullName -Algorithm SHA256).Hash}}
          $artifacts | ConvertTo-Json -Depth 4 | Set-Content evidence/build-artifacts.json -Encoding utf8
          if (-not ($artifacts | Where-Object { $_.FullName -match '\.(sys)$' })) { throw 'No .sys driver artifact was produced.' }
          Get-Content evidence/build-artifacts.json

      - name: Classify driver install capability
        shell: pwsh
        continue-on-error: true
        run: |
          $inf = Get-ChildItem wds/hid/vhidmini2 -Recurse -File -Filter '*.inf' |
            Where-Object { $_.FullName -match '\\x64\\Release\\' } |
            Select-Object -First 1
          $result = [ordered]@{ attempted=$false; inf=$null; exit_code=$null; classification='no-built-inf'; output=@() }
          if ($inf) {
            $result.attempted = $true
            $result.inf = $inf.FullName
            $lines = & pnputil.exe /add-driver $inf.FullName /install 2>&1
            $code = $LASTEXITCODE
            $result.exit_code = $code
            $result.output = @($lines | ForEach-Object { "$_" })
            if ($code -eq 0) { $result.classification='hosted-runner-driver-install-accepted' }
            else {
              $joined = $result.output -join "`n"
              if ($joined -match 'signature|signed|publisher|hash|certificate') { $result.classification='hosted-runner-signing-boundary' }
              elseif ($joined -match 'reboot|restart') { $result.classification='hosted-runner-reboot-boundary' }
              elseif ($joined -match 'access|denied|privilege|administrator') { $result.classification='hosted-runner-privilege-boundary' }
              else { $result.classification='hosted-runner-install-unsupported-or-other' }
            }
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content evidence/install-capability.json -Encoding utf8
          Get-Content evidence/install-capability.json

      - name: Enumerate HID state
        if: always()
        shell: pwsh
        run: |
          Get-PnpDevice -Class HIDClass -ErrorAction SilentlyContinue |
            Select-Object Status,Class,FriendlyName,InstanceId |
            ConvertTo-Json -Depth 5 | Set-Content evidence/hid-enumeration.json -Encoding utf8

      - name: Summarize disposition
        if: always()
        shell: pwsh
        run: |
          [ordered]@{
            build = if (Test-Path evidence/build-artifacts.json) { 'attempted' } else { 'not-completed' }
            install = if (Test-Path evidence/install-capability.json) { (Get-Content evidence/install-capability.json | ConvertFrom-Json).classification } else { 'not-attempted' }
            next = 'Keep GitHub Actions as first executor. Escalate only cells blocked by concrete hosted-runner evidence.'
          } | ConvertTo-Json -Depth 4 | Set-Content evidence/summary.json -Encoding utf8
          Get-Content evidence/summary.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vhf-actions-qualification
          path: evidence/
          if-no-files-found: error
          retention-days: 14
