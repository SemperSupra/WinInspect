name: WinInspect concept sweep — SearXNG dual-track rep

on:
  push:
    branches:
      - experiment/wininspect-concept-dual-track-searxng

permissions:
  contents: read

jobs:
  concept-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare loopback-only SearXNG configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/searxng"
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          path = Path("${{ runner.temp }}") / "searxng" / "settings.yml"
          secret = secrets.token_hex(32)
          path.write_text(
              "use_default_settings: true\n"
              "server:\n"
              f"  secret_key: \"{secret}\"\n"
              "search:\n"
              "  formats:\n"
              "    - html\n"
              "    - json\n",
              encoding="utf-8",
          )
          PY

      - name: Start pinned SearXNG on loopback
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name wininspect-concept-searxng \
            -p 127.0.0.1:8888:8080 \
            -v "$RUNNER_TEMP/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            searxng/searxng@sha256:55e1fa15a63ff04e79e213e6aa2837549877b0c6d60757cdb633ae9111cb5fea

      - name: Wait for SearXNG readiness
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error \
              'http://127.0.0.1:8888/search?q=readiness&format=json&pageno=1&language=en' \
              -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'SearXNG did not become ready' >&2
          docker logs --tail 100 wininspect-concept-searxng >&2 || true
          exit 1

      - name: Run fixed multilingual concept sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 experiments/run_wininspect_concept_searxng.py \
            --base-url http://127.0.0.1:8888 \
            --queries experiments/wininspect-concept-sweep-queries.json \
            --output out/wininspect-concept-searxng-result.json \
            | tee out/summary.json

      - name: Run bounded negative-space reformulations
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/run_wininspect_concept_searxng.py \
            --base-url http://127.0.0.1:8888 \
            --queries experiments/wininspect-concept-sweep-negative-space.json \
            --output out/wininspect-concept-searxng-negative-space.json \
            | tee out/negative-space-summary.json

      - name: Validate privacy-safe result shapes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('out/wininspect-concept-searxng-result.json'),
              Path('out/wininspect-concept-searxng-negative-space.json'),
          ]
          for p in paths:
              x = json.loads(p.read_text(encoding='utf-8'))
              assert x['schema'] == 'wininspect.concept-sweep.searxng-result.v1'
              assert x['authority_effect'] == 'none'
              assert x['evidence_semantics']['search_membership_is_semantic_truth'] is False
              assert x['evidence_semantics']['negative_result_is_concept_absence'] is False
              assert x['privacy']['raw_result_urls_persisted'] is False
              assert x['privacy']['raw_result_titles_persisted'] is False
              assert x['privacy']['raw_result_snippets_persisted'] is False
              serialized = p.read_text(encoding='utf-8').lower()
              for forbidden in ('private_revision', 'private_path', 'access_token', 'authorization: bearer'):
                  assert forbidden not in serialized, (p, forbidden)
              print(json.dumps({
                  'file': p.name,
                  'planned': x['request_counts']['planned'],
                  'succeeded': x['request_counts']['succeeded'],
                  'failed': x['request_counts']['failed'],
                  'engines': x['coverage']['engines'],
                  'by_cluster_result_count': x['coverage']['by_cluster_result_count'],
                  'by_language_result_count': x['coverage']['by_language_result_count'],
              }, ensure_ascii=False, indent=2))
          PY

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: wininspect-concept-sweep-searxng
          path: |
            out/wininspect-concept-searxng-result.json
            out/summary.json
            out/wininspect-concept-searxng-negative-space.json
            out/negative-space-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop SearXNG
        if: always()
        shell: bash
        run: docker rm -f wininspect-concept-searxng >/dev/null 2>&1 || true
