name: GitHub Windows capability census
run-name: "sidecar:${{ inputs.workset_id }}:${{ inputs.delegation_id }}:${{ inputs.assignment_id }}"
on:
  workflow_dispatch:
    inputs:
      assignment_id:
        description: Stable assignment/idempotency key; use manual outside Agent Dispatch
        required: false
        default: manual
        type: string
      workset_id:
        description: Correlation only; authoritative workset remains outside Actions
        required: false
        default: manual
        type: string
      delegation_id:
        description: Bounded workset delegation being executed
        required: false
        default: manual
        type: string
  pull_request:
    paths:
      - tools/github-windows-capability-census.ps1
      - tools/hyperv-linux-l2-nonce.ps1
      - tools/windows-container-nanoserver.ps1
      - tools/windows-servercore-powershell.ps1
      - tools/windows-dotnet-powershell-nano.ps1
      - .github/workflows/github-windows-capability-census.yml

concurrency:
  group: windows-capability-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  census:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.workset_id == 'manual' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [windows-2025, windows-11-arm]
        mode: [passive, capacity, exercise, virtualization]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Preflight storage guardrail
        shell: powershell
        run: |
          $d=Get-PSDrive -Name C
          Write-Host "FREE_BYTES=$($d.Free)"
          if($d.Free -lt 4GB){ throw 'Less than 4 GiB free; refusing active census.' }
      - name: Census
        shell: powershell
        run: ./tools/github-windows-capability-census.ps1 -Mode '${{ matrix.mode }}'
      - name: Preserve receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capability-${{ matrix.runner }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/windows-capability-*.json
          if-no-files-found: warn
          retention-days: 7

  observation-cycles:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.workset_id == 'manual' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [windows-2025, windows-11-arm]
        cycle: [1, 2, 3]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Observation cycle
        shell: powershell
        run: ./tools/github-windows-capability-census.ps1 -Mode passive
      - name: Preserve observation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observation-${{ matrix.runner }}-${{ matrix.cycle }}
          path: ${{ runner.temp }}/windows-capability-*.json
          if-no-files-found: warn
          retention-days: 7

  linux-l2-gate:
    # Qualified on PR #32; rerun only by explicit/manual or sidecar dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Parse L2 probe before execution
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './tools/hyperv-linux-l2-nonce.ps1'),[ref]$tokens,[ref]$errors)
          if($errors){
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'L2 probe parse preflight failed.'
          }
      - name: Storage guardrail
        shell: powershell
        run: |
          $d=Get-PSDrive C
          if($d.Free -lt 6GB){ throw 'Less than 6 GiB free; refusing L2 experiment.' }
      - name: Bounded Linux L2 gate
        shell: powershell
        run: ./tools/hyperv-linux-l2-nonce.ps1
      - name: Preserve L2 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-l2-${{ matrix.runner }}
          path: ${{ runner.temp }}/hyperv-linux-l2-*.json
          if-no-files-found: warn
          retention-days: 7

  windows-container-nanoserver:
    # Qualified; rerun only when explicitly selected through workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.delegation_id == 'windows-container-nanoserver' }}
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Parse Nano Server probe before execution
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tools\windows-container-nanoserver.ps1'),[ref]$tokens,[ref]$errors)
          if($errors){$errors|ForEach-Object{Write-Error $_}; throw 'Nano Server probe parser qualification failed'}
      - name: Bounded Nano Server isolation oracle
        shell: powershell
        run: ./tools/windows-container-nanoserver.ps1
      - name: Preserve Nano Server receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-container-nanoserver
          path: ${{ runner.temp }}/windows-container-nanoserver.json
          if-no-files-found: warn
          retention-days: 7

  windows-servercore-powershell:
    # Expensive 5.62 GB candidate; keep explicit-only after harness characterization.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.delegation_id == 'windows-servercore-powershell' }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Parse Server Core probe before execution
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tools\windows-servercore-powershell.ps1'),[ref]$tokens,[ref]$errors)
          if($errors){$errors|ForEach-Object{Write-Error $_}; throw 'Server Core probe parser qualification failed'}
      - name: Bounded Server Core PowerShell isolation oracle
        shell: powershell
        run: ./tools/windows-servercore-powershell.ps1
      - name: Preserve Server Core receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-servercore-powershell
          path: ${{ runner.temp }}/windows-servercore-powershell.json
          if-no-files-found: warn
          retention-days: 7

  windows-dotnet-powershell-nano:
    # Qualified; rerun only when explicitly selected through workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.delegation_id == 'windows-dotnet-powershell-nano' }}
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Parse Nano .NET PowerShell probe before execution
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tools\windows-dotnet-powershell-nano.ps1'),[ref]$tokens,[ref]$errors)
          if($errors){$errors|ForEach-Object{Write-Error $_}; throw 'Nano .NET PowerShell probe parser qualification failed'}
      - name: Bounded Nano .NET PowerShell isolation oracle
        shell: powershell
        run: ./tools/windows-dotnet-powershell-nano.ps1
      - name: Preserve Nano .NET PowerShell receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-dotnet-powershell-nano
          path: ${{ runner.temp }}/windows-dotnet-powershell-nano.json
          if-no-files-found: warn
          retention-days: 7
