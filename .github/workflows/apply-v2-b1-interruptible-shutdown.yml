name: Apply V2-B1 interruptible shutdown patch

on:
  push:
    branches:
      - experiment/375-daemon-shutdown-lifecycle-mvp
    paths:
      - .qualification/v2-b1-interruptible-shutdown.patch
      - .github/workflows/apply-v2-b1-interruptible-shutdown.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .qualification/v2-b1-interruptible-shutdown.patch
          git apply .qualification/v2-b1-interruptible-shutdown.patch
          git diff --check

      - name: Remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .qualification/v2-b1-interruptible-shutdown.patch
          rm -f .github/workflows/apply-v2-b1-interruptible-shutdown.yml
          rmdir .qualification 2>/dev/null || true

      - name: Commit exact patched tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make daemon background waits interruptible"
          git push origin HEAD:${GITHUB_REF_NAME}
