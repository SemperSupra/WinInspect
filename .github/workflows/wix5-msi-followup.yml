name: WiX 5 MSI transaction follow-up

on:
  pull_request:
    paths:
      - '.github/workflows/wix5-msi-followup.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download exact native payloads from first MSI rep
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wix-payload-*
          path: incoming
          repository: SemperSupra/WinInspect
          run-id: '35192936850'
          github-token: ${{ github.token }}
      - name: Install pinned pre-OSMF WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version
      - name: Build x64 and ARM64 A/B MSIs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $hashes=[ordered]@{architectures=[ordered]@{}}
          foreach($arch in @('x64','arm64')) {
            $src=Join-Path incoming "wix-payload-$arch"
            $a=Join-Path work "$arch-a"; $b=Join-Path work "$arch-b"
            New-Item -ItemType Directory -Force $a,$b | Out-Null
            foreach($name in @('wininspectd.exe','wininspect.exe','wininspect-gui.exe')) {
              Copy-Item (Join-Path $src $name) (Join-Path $a $name) -Force
              Copy-Item (Join-Path $src $name) (Join-Path $b $name) -Force
              [IO.File]::AppendAllText((Join-Path $b $name),'WININSPECT_WIX_B')
            }
            $hashes.architectures[$arch]=[ordered]@{a=[ordered]@{};b=[ordered]@{}}
            foreach($name in @('wininspectd.exe','wininspect.exe','wininspect-gui.exe')) {
              $hashes.architectures[$arch].a[$name]=(Get-FileHash (Join-Path $a $name) -Algorithm SHA256).Hash.ToLowerInvariant()
              $hashes.architectures[$arch].b[$name]=(Get-FileHash (Join-Path $b $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            wix build source/tools/winspect-msi.wxs -arch $arch -d "Payload=$a" -d ProductVersion=1.0.1 -o "dist/WinInspect-WiX-$arch-a.msi"
            if($LASTEXITCODE -ne 0){throw "WiX A build failed for $arch"}
            wix build source/tools/winspect-msi.wxs -arch $arch -d "Payload=$b" -d ProductVersion=1.0.2 -o "dist/WinInspect-WiX-$arch-b.msi"
            if($LASTEXITCODE -ne 0){throw "WiX B build failed for $arch"}
          }
          $hashes|ConvertTo-Json -Depth 6|Set-Content dist/expected-hashes.json -Encoding utf8NoBOM
          Get-ChildItem dist|Format-Table Name,Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wix5-msi-candidates
          path: dist
          retention-days: 7

  windows:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            pe_machine: 34404
          - runner: windows-11-arm
            arch: arm64
            pe_machine: 43620
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wix5-msi-candidates
          path: dist
      - name: Qualify lifecycle and locked-file rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $arch='${{ matrix.arch }}'; $root=Join-Path $env:LOCALAPPDATA 'WinInspect'
          $expected=Get-Content dist/expected-hashes.json -Raw|ConvertFrom-Json -AsHashtable
          $names=@('wininspectd.exe','wininspect.exe','wininspect-gui.exe')
          function Msi([string]$v){(Resolve-Path "dist/WinInspect-WiX-$arch-$v.msi").Path}
          function Invoke-Msi([string[]]$args,[string]$log){
            $all=@()+$args+@('/qn','/norestart','REBOOT=ReallySuppress','MSIRESTARTMANAGERCONTROL=Disable','/l*v',$log)
            $p=Start-Process msiexec.exe -ArgumentList $all -PassThru -Wait; return $p.ExitCode
          }
          function Install([string]$v){$c=Invoke-Msi @('/i',('"'+(Msi $v)+'"')) "install-$v.log";if($c-ne 0){throw "Install $v failed: $c"}}
          function Assert-Hashes([string]$v){foreach($n in $names){$a=(Get-FileHash (Join-Path $root $n)-Algorithm SHA256).Hash.ToLowerInvariant();$w=[string]$expected['architectures'][$arch][$v][$n];if($a-ne$w){throw "$n mismatch $arch/$v actual=$a want=$w"}}}
          function Machine([string]$p){$b=[IO.File]::ReadAllBytes($p);$o=[BitConverter]::ToInt32($b,0x3c);[BitConverter]::ToUInt16($b,$o+4)}
          function ArpEntries{$r=@('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*');@($r|%{Get-ItemProperty $_ -ErrorAction SilentlyContinue}|?{$_.DisplayName-eq'WinInspect'})}

          Install a; Assert-Hashes a
          if((Machine (Join-Path $root 'wininspect.exe'))-ne${{ matrix.pe_machine }}){throw 'Native PE mismatch'}
          & (Join-Path $root 'wininspect.exe') '--version' *> $null;if($LASTEXITCODE-ne0){throw 'Installed CLI failed'}
          Install a; Assert-Hashes a
          Install b; Assert-Hashes b
          Install a; Assert-Hashes a

          $locked=[IO.File]::Open((Join-Path $root 'wininspect.exe'),[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::None)
          try{$lockExit=Invoke-Msi @('/i',('"'+(Msi b)+'"')) 'locked-upgrade.log'}finally{$locked.Dispose()}
          $preserved=$true;$hashError=$null;try{Assert-Hashes a}catch{$preserved=$false;$hashError=$_.Exception.Message}
          $arp=ArpEntries
          [ordered]@{exitCode=$lockExit;hashesPreserved=$preserved;hashError=$hashError;arpVersions=@($arp.DisplayVersion);arpCount=$arp.Count}|ConvertTo-Json -Depth 4|Set-Content "lock-$arch.json" -Encoding utf8NoBOM
          Get-Content "lock-$arch.json"
          if($lockExit-eq0){throw 'Locked upgrade incorrectly returned success'}
          if(-not$preserved){throw "MSI rollback did not restore A: $hashError"}
          if($arp.Count-ne1-or[string]$arp[0].DisplayVersion-ne'1.0.1'){throw "ARP state after rollback is not exactly A: $($arp.DisplayVersion -join ',')"}

          Copy-Item (Msi b) dist/corrupt.msi -Force
          $fs=[IO.File]::Open('dist/corrupt.msi',[IO.FileMode]::Open,[IO.FileAccess]::Write,[IO.FileShare]::None);try{$fs.SetLength([Math]::Min(4096,$fs.Length))}finally{$fs.Dispose()}
          $bad=Invoke-Msi @('/i',('"'+(Resolve-Path dist/corrupt.msi).Path+'"')) 'corrupt.log';if($bad-eq0){throw 'Corrupt MSI accepted'};Assert-Hashes a
          $u=Invoke-Msi @('/x',('"'+(Msi a)+'"')) 'uninstall.log';if($u-ne0){throw "Uninstall failed: $u"};Start-Sleep 2
          if(Test-Path $root){throw 'Install directory residue remains'};if((ArpEntries).Count-ne0){throw 'ARP residue remains'}
          [ordered]@{schemaVersion=1;architecture=$arch;cleanInstall=$true;nativePE=$true;repeatInstall=$true;upgrade=$true;downgradeExact=$true;lockedBinaryExit=$lockExit;transactionalRollback=$true;corruptPackageRejected=$true;uninstallClean=$true;scope='hosted package qualification only'}|ConvertTo-Json|Set-Content "evidence-$arch.json" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wix5-evidence-${{ matrix.arch }}
          path: |
            lock-${{ matrix.arch }}.json
            evidence-${{ matrix.arch }}.json
            locked-upgrade.log
            corrupt.log
          if-no-files-found: warn
          retention-days: 7

  wine:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wix5-msi-candidates
          path: dist
      - run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine64 wine32 >/dev/null
          wine --version
      - name: Qualify x64 MSI under Wine
        shell: bash
        env:
          WINEDEBUG: '-all'
          WINEPREFIX: ${{ github.workspace }}/wineprefix
        run: |
          set -euo pipefail;export WINEARCH=win64;wineboot -u
          A="$(pwd)/dist/WinInspect-WiX-x64-a.msi";B="$(pwd)/dist/WinInspect-WiX-x64-b.msi"
          install_msi(){ wine msiexec /i "$1" /qn /norestart; }
          install_msi "$A"
          local_win="$(wine cmd /c 'echo %LOCALAPPDATA%'|tr -d '\r')";root="$(winepath -u "$local_win")/WinInspect"
          test -f "$root/winspect.exe";wine "$root/winspect.exe" --version >/dev/null
          install_msi "$A";install_msi "$B";wine "$root/winspect.exe" --version >/dev/null;install_msi "$A";wine "$root/winspect.exe" --version >/dev/null
          wine msiexec /x "$A" /qn /norestart;sleep 2;test ! -d "$root"
          echo '{"schemaVersion":1,"wineLifecycle":true,"x64Msi":true,"cleanInstall":true,"repeatInstall":true,"upgrade":true,"downgrade":true,"installedCli":true,"uninstallClean":true}' > wine-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wix5-evidence-wine
          path: wine-evidence.json
          if-no-files-found: warn
          retention-days: 7
