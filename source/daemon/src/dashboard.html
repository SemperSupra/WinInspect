<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>WinInspect Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#1a1d23;color:#e0e0e0;padding:20px}
h1{color:#4fc3f7;margin-bottom:4px;font-size:24px}
.tagline{color:#888;font-size:13px;margin-bottom:20px}
h2{color:#4fc3f7;margin:20px 0 10px;font-size:18px}
.card{background:#1e2128;border-radius:8px;padding:15px;margin-bottom:15px;border:1px solid #2a2d35}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{display:block;margin:8px 0 4px;color:#888;font-size:12px}
input,select,button{width:100%;padding:8px;border:1px solid #2a2d35;border-radius:4px;background:#252830;color:#e0e0e0;font-size:14px}
button{background:#1565c0;color:#fff;font-weight:bold;cursor:pointer;margin-top:8px;border:1px solid #1565c0}
button:hover{background:#1976d2}
pre{background:#111318;padding:10px;border-radius:4px;overflow:auto;font-size:12px;max-height:300px;border:1px solid #2a2d35}
img{max-width:100%;border-radius:4px}
.row{display:flex;gap:8px}.row input{flex:1}.row button{flex:0;width:auto;padding:8px 16px}
.strix{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.strix svg{width:40px;height:40px}
</style></head><body>
<div class=strix>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<rect x="6" y="10" width="56" height="42" rx="4" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.4"/>
<line x1="6" y1="20" x2="62" y2="20" stroke="#4fc3f7" stroke-width="2" opacity="0.4"/>
<ellipse cx="34" cy="40" rx="10" ry="12" fill="#4fc3f7"/>
<circle cx="34" cy="30" r="8" fill="#4fc3f7"/>
<polygon points="28,26 26,20 31,24" fill="#4fc3f7"/>
<polygon points="40,26 42,20 37,24" fill="#4fc3f7"/>
<circle cx="31" cy="29" r="2.5" fill="#111"/><circle cx="37" cy="29" r="2.5" fill="#111"/>
<polygon points="32,32 34,35 36,32" fill="#f9a825"/>
</svg>
<div><h1>WinInspect</h1><div class=tagline>window inspection for Windows and Wine</div></div>
</div>
<div class=grid><div>
<div class=card><h2>Status</h2>
<div id=ctrlState style="font-size:20px;font-weight:bold;padding:8px;border-radius:4px;background:#333;text-align:center">○ Connecting...</div>
<div id=recState style="font-size:14px;margin-top:4px;color:#888">Not recording</div>
<div id=connStatus style=margin-top:8px;color:#888;font-size:12px">Disconnected</div>
<div id=ctrlInfo style="margin-top:4px;font-size:12px;color:#666"></div>
</div>
<div class=card><h2>Connection</h2><div class=row><input id=url value=http://localhost:8088><button onclick=connect()>Connect</button></div></div>
<div class=card><h2>Identity</h2><pre id=identity></pre></div></div><div>
<div class=card><h2>Control</h2>
<button onclick=takeControl() style="background:#e67e22;color:#fff;margin-bottom:4px">👤 Take Human Control</button>
<button onclick=releaseControl() style="background:#27ae60;color:#fff">🤖 Release to Agent</button>
</div>
<div class=card><h2>Actions</h2>
<label>Click X,Y</label><div class=row><input id=cx placeholder=X value=500><input id=cy placeholder=Y value=500><button onclick=doClick()>Click</button></div>
<label>Type text</label><div class=row><input id=txt placeholder=text><button onclick=doType()>Type</button></div>
<label>Hotkey</label><div class=row><input id=hk placeholder="Ctrl+C"><button onclick=doHotkey()>Send</button></div>
</div></div></div>
<div class=card><h2>Screen</h2><button onclick=capture()>Capture</button><img id=ss style=display:none;margin-top:10px></div>
<div class=card><h2>Windows</h2><button onclick=listWin()>Refresh</button><pre id=wlist></pre></div>
<script>
let BASE='http://localhost:8088';
let ws=null;

async function api(p,m,b){
  let o={method:m||'GET',headers:{'Content-Type':'application/json'}};
  if(b)o.body=JSON.stringify(b);
  let r=await fetch(BASE+p,o);
  return r.json();
}

function connectWS(){
  if(ws)ws.close();
  let u=BASE.replace(/^http/,'ws')+'/api/v1/events';
  try{
    ws=new WebSocket(u);
    ws.onopen=()=>updateControl('idle','','');
    ws.onclose=()=>updateControl('disconnected','','');
  }catch(e){}
}

function updateControl(state,ctrl,id){
  let el=document.getElementById('ctrlState');
  let info=document.getElementById('ctrlInfo');
  if(state==='disconnected'){el.style.background='#555';el.textContent='⏸ Disconnected';info.textContent='';return}
  if(ctrl==='human'){el.style.background='#4caf50';el.textContent='👤 Human in control'}
  else if(ctrl==='agent'||ctrl==='script'){el.style.background='#e53935';el.textContent='🤖 '+ctrl.charAt(0).toUpperCase()+ctrl.slice(1)+' in control'}
  else{el.style.background='#555';el.textContent='○ Idle (no controller)'}
  info.textContent=id?'ID: '+id:'';
}

async function refreshStatus(){
  try{
    let s=await api('/api/v1/health');
    let i=await api('/api/v1/identity');
    document.getElementById('identity').textContent=JSON.stringify(i.result||i,null,2);
    document.getElementById('connStatus').textContent='Connected '+(s.result?os||'');
  }catch(e){
    document.getElementById('connStatus').textContent='Disconnected';
  }
}

async function connect(){
  BASE=document.getElementById('url').value.replace(/\/+$/,'');
  connectWS();
  await refreshStatus();
}

async function takeControl(){
  try{
    let r=await api('/api/v1/health','POST',{method:'control.take',params:{controller:'human',id:'dashboard'}});
    if(r.ok||r.error_code==='E_CONTROL_DENIED')updateControl('idle','human','dashboard');
  }catch(e){}
  await refreshStatus();
}

async function releaseControl(){
  try{
    await api('/api/v1/health','POST',{method:'control.release',params:{controller:'human'}});
  }catch(e){}
  await refreshStatus();
}

async function capture(){
  try{
    let r=await api('/api/v1/capture','POST',{left:0,top:0,right:1920,bottom:1080});
    let d=r.result?.data_b64;
    if(d){document.getElementById('ss').src='data:image/bmp;base64,'+d;document.getElementById('ss').style.display='block'}
  }catch(e){alert(e.message)}
}

async function doClick(){await api('/api/v1/click','POST',{x:+document.getElementById('cx').value,y:+document.getElementById('cy').value})}
async function doType(){let t=document.getElementById('txt').value;if(t)await api('/api/v1/type','POST',{text:t})}
async function doHotkey(){let k=document.getElementById('hk').value;if(k)await api('/api/v1/hotkey','POST',{keys:k})}
async function listWin(){let r=await api('/api/v1/windows');document.getElementById('wlist').textContent=JSON.stringify(r.result||r,null,2)}

setTimeout(connect,500);
</script></body></html>
