<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Strix the Window Owl — App Icon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Window frame (generic, no Windows logo) -->
  <rect x="48" y="52" width="160" height="120" rx="8" fill="none" stroke="#fff" stroke-width="4" opacity="0.3"/>
  <line x1="48" y1="76" x2="208" y2="76" stroke="#fff" stroke-width="4" opacity="0.3"/>
  <circle cx="62" cy="64" r="4" fill="#fff" opacity="0.3"/>
  <!-- Strix the Owl (centered inside window) -->
  <!-- Body -->
  <ellipse cx="128" cy="108" rx="32" ry="36" fill="#fff"/>
  <!-- Head -->
  <circle cx="128" cy="84" r="24" fill="#fff"/>
  <!-- Ear tufts -->
  <polygon points="108,66 104,52 116,64" fill="#fff"/>
  <polygon points="148,66 152,52 140,64" fill="#fff"/>
  <!-- Eyes -->
  <circle cx="118" cy="82" r="7" fill="#0d47a1"/>
  <circle cx="138" cy="82" r="7" fill="#0d47a1"/>
  <circle cx="118" cy="82" r="3" fill="#fff"/>
  <circle cx="138" cy="82" r="3" fill="#fff"/>
  <!-- Beak -->
  <polygon points="124,90 128,96 132,90" fill="#f9a825"/>
  <!-- Magnifying glass (WinInspect tool, held by Strix) -->
  <g transform="translate(152, 100) rotate(45)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#f9a825" stroke-width="4"/>
    <line x1="10" y1="10" x2="22" y2="22" stroke="#f9a825" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Tagline text area -->
  <text x="128" y="180" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif" opacity="0.7">WinInspect</text>
</svg>
