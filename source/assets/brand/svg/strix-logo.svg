<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- WinInspect Logo with Strix -->
  <!-- Strix icon area -->
  <g transform="translate(20, 10)">
    <rect width="100" height="100" rx="20" fill="#1565c0"/>
    <!-- Window frame -->
    <rect x="18" y="20" width="64" height="48" rx="4" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <line x1="18" y1="30" x2="82" y2="30" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <!-- Strix -->
    <ellipse cx="50" cy="50" rx="14" ry="16" fill="#fff"/>
    <circle cx="50" cy="38" r="10" fill="#fff"/>
    <polygon points="42,32 40,24 46,30" fill="#fff"/>
    <polygon points="58,32 60,24 54,30" fill="#fff"/>
    <circle cx="46" cy="37" r="3" fill="#1565c0"/>
    <circle cx="54" cy="37" r="3" fill="#1565c0"/>
    <circle cx="46" cy="37" r="1.5" fill="#fff"/>
    <circle cx="54" cy="37" r="1.5" fill="#fff"/>
    <polygon points="48,40 50,44 52,40" fill="#f9a825"/>
    <!-- Magnifier -->
    <g transform="translate(64, 46) rotate(45)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#f9a825" stroke-width="2"/>
      <line x1="4" y1="4" x2="10" y2="10" stroke="#f9a825" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Text -->
  <text x="140" y="52" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#1565c0">WinInspect</text>
  <text x="140" y="76" font-family="system-ui, sans-serif" font-size="13" fill="#888">window inspection for Windows and Wine</text>
</svg>
