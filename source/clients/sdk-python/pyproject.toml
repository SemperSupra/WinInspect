[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wininspect"
version = "0.1.0"
description = "Python SDK for WinInspect remote desktop automation daemon"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "PolyForm Noncommercial 1.0.0"}
authors = [
    {name = "Mark E. DeYoung"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "websocket-client>=1.0",
]

[project.urls]
Homepage = "https://github.com/SemperSupra/WinInspect"
Source = "https://github.com/SemperSupra/WinInspect"
Tracker = "https://github.com/SemperSupra/WinInspect/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=4.0",
]
